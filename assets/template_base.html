<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スライドプレゼンテーション</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: 'var(--brand-50, #eef2ff)',
              100: 'var(--brand-100, #e0e7ff)',
              200: 'var(--brand-200, #c7d2fe)',
              300: 'var(--brand-300, #a5b4fc)',
              400: 'var(--brand-400, #818cf8)',
              500: 'var(--brand-500, #6366f1)',
              600: 'var(--brand-600, #4f46e5)',
              700: 'var(--brand-700, #4338ca)',
              900: 'var(--brand-900, #312e81)',
              950: 'var(--brand-950, #1e1b4b)',
            },
            accent: {
              400: 'var(--accent-400, #38bdf8)',
              500: 'var(--accent-500, #0ea5e9)',
              600: 'var(--accent-600, #0284c7)',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* CSS変数による動的カラー制御（デフォルト: Indigo） */
    :root {
      --brand-50: #eef2ff;
      --brand-100: #e0e7ff;
      --brand-200: #c7d2fe;
      --brand-300: #a5b4fc;
      --brand-400: #818cf8;
      --brand-500: #6366f1;
      --brand-600: #4f46e5;
      --brand-700: #4338ca;
      --brand-900: #312e81;
      --brand-950: #1e1b4b;
      --accent-400: #38bdf8;
      --accent-500: #0ea5e9;
      --accent-600: #0284c7;
    }

    /* ========================================================
       【用紙サイズ・アスペクト比設定】
       要件に応じて以下のいずれかを選択して設定します:
       1) 16:9 ワイド (デフォルト)
          @page { size: 16in 9in; margin: 0; }
          .slide { width: 1280px; height: 720px; }
          .slide-meta-box { width: 1280px; }

       2) 4:3 スタンダード
          @page { size: 4in 3in; margin: 0; }
          .slide { width: 1024px; height: 768px; }
          .slide-meta-box { width: 1024px; }

       3) A4 横 (A4 Landscape - 印刷・稟議・配布用スライド)
          @page { size: A4 landscape; margin: 0; }
          .slide { width: 1188px; height: 840px; }
          .slide-meta-box { width: 1188px; }

       4) A4 縦 (A4 Portrait - 企画書・1枚ペーパー・報告書)
          @page { size: A4 portrait; margin: 0; }
          .slide { width: 840px; height: 1188px; }
          .slide-meta-box { width: 840px; }
       ======================================================== */
    @page {
      size: 16in 9in;
      margin: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0f172a;
    }

    /* 印刷時の設定（余白ゼロ・改ページずれゼロ） */
    @media print {
      body {
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .slide-viewport {
        padding: 0 !important;
        gap: 0 !important;
        display: block !important;
      }
      .slide {
        width: 16in !important;
        height: 9in !important;
        max-width: none !important;
        max-height: none !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin: 0 auto !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
    }

    /* 画面表示時のスライドボックス */
    .slide {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      background-color: #ffffff;
      outline: none;
    }

    /* ── AI出力安定化: 強制文字溢れ防止 (Line-Clamping) ── */
    .slide .ai-content {
      overflow: hidden;
      min-height: 0;
      flex: 1 1 0%;
    }
    .slide .ai-content > * {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slide .ai-content h2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .slide .ai-content h3 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .slide .ai-content p  { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
    .slide .ai-content li { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-5 { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── 編集モード状態に応じた選択・操作制御（フェイルセーフ設計） ── */
    body.is-editable main .slide {
      user-select: text;
      -webkit-user-select: text;
    }
    body:not(.is-editable) main .slide {
      user-select: none !important;
      -webkit-user-select: none !important;
      cursor: default !important;
    }

    /* 編集可能モードのアウトライン視覚化 */
    [contenteditable="true"]:focus {
      outline: 2px solid var(--brand-500, #6366f1);
      outline-offset: -2px;
    }

    /* スライドコメント（修正指示）入力ボックス & メタ情報ボックス */
    .slide-meta-box {
      color: #f1f5f9;
    }
    .slide-meta-title {
      color: #a5b4fc; /* brand-300: 鮮やかで高視認性 */
      font-weight: 600;
    }
    .slide-comment-input {
      color: #f8fafc !important; /* 入力文字は鮮明な白 */
    }
    .slide-comment-input:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8 !important; /* slate-400: 背景と同化せずくっきり読める */
      pointer-events: none;
    }
    .slide-comment-input:focus:empty:before {
      color: #cbd5e1 !important; /* フォーカス時も薄くならず視認可能 */
    }
    @media print {
      .slide-meta-box,
      .slide-comment-box,
      #presentationModal {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 selection:bg-brand-500 selection:text-white pb-20 is-editable">

  <!-- 固定操作ツールバー（印刷時は非表示） -->
  <header class="no-print sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white px-6 py-2.5 shadow-lg flex items-center justify-between gap-4 min-h-[56px]">
    <!-- 左側: タイトル & メタ情報 ＋ モード切替タブ（タイトルの右隣に配置して被りを完全防止） -->
    <div class="flex items-center gap-4 shrink-0">


      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-accent-500 font-bold text-sm shadow">
        ANS
      </div>
      <div>
        <h1 id="deckTitleText" class="text-sm font-semibold tracking-wide max-w-[260px] truncate">スライドタイトル</h1>
        <div class="flex items-center gap-2 text-[11px] text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="deckRatioText">16:9 ワイド (1280 × 720)</span>
          <span class="text-slate-600">|</span>
          <span id="deckSlideCountText">全1スライド</span>
        </div>
      </div>

    <!-- 右側: アクションコントローラー群（単一ツールバー） -->
    <div class="flex items-center gap-2.5 shrink-0 ml-auto">
      <!-- 編集モード切替（ON: 編集可能 / OFF: 閲覧専用・選択禁止） -->
      <button id="toggleEditBtn" onclick="toggleEditMode()" title="編集モード切り替え (ショートカット: E)" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-all flex items-center gap-1.5 active:scale-95">
        <svg id="editIcon" class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span id="editStatusText">編集: ON</span>
        <kbd class="px-1 py-0.2 text-[10px] font-mono bg-slate-900 text-slate-400 rounded border border-slate-700">E</kbd>
      </button>

      <!-- 反復修正指示アクション（エージェント連携） -->
      <button id="copyCommentsBtn" onclick="copySlideComments()" title="入力された全スライドの修正指示をコピーしてAIに貼り付け" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-all flex items-center gap-1.5 active:scale-95">
        <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
        </svg>
        <span>指示をコピー</span>
      </button>

      <!-- 全画面プレゼンテーションモード（スライドショー） -->
      <button onclick="startPresentation()" title="全画面スライドショー開始 (ショートカット: F)" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5 active:scale-95">
        <span class="text-xs">▶</span>
        <span>全画面発表</span>
        <kbd class="px-1 py-0.2 text-[10px] font-mono bg-emerald-950 text-emerald-200 rounded border border-emerald-500/30">F</kbd>
      </button>

      <!-- PDF保存ボタン -->
      <button onclick="window.print()" class="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-brand-600 to-accent-600 hover:from-brand-500 hover:to-accent-500 text-white text-xs font-semibold shadow-md shadow-brand-500/20 transition-all flex items-center gap-1.5 active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        <span>PDF保存</span>
      </button>
    </div>
  </header>



  <!-- 全画面プレゼンテーションモーダル（印刷時は非表示） -->
  <div id="presentationModal" class="no-print fixed inset-0 bg-black z-50 hidden select-none flex flex-col justify-center items-center overflow-hidden">
    <!-- スライド描画ステージ -->
    <div id="presentationStageWrapper" onclick="handleStageClick(event)" class="relative flex items-center justify-center w-full h-full cursor-pointer">
      <div id="presentationStage" class="transition-transform duration-100 ease-out origin-center"></div>
    </div>



    <!-- 下部フローティングコントローラーバー -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 rounded-full px-4 py-1.5 shadow-2xl flex items-center gap-3 text-xs text-white opacity-40 hover:opacity-100 transition-opacity">
      <button onclick="prevSlide()" title="前のスライド (← / ↑ / PageUp)" class="p-1.5 hover:bg-slate-700 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span id="presentationCounter" class="font-mono text-xs text-slate-300 min-w-[50px] text-center">1 / 1</span>
      <button onclick="nextSlide()" title="次のスライド (→ / ↓ / Space / PageDown)" class="p-1.5 hover:bg-slate-700 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>

      <div class="w-px h-4 bg-slate-700"></div>
      <button onclick="stopPresentation()" title="発表終了 (Esc)" class="p-1.5 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- テキスト選択時ミニフローティング書式バー（印刷時は非表示） -->
  <div id="selectionToolbar" class="no-print absolute hidden z-50 bg-slate-900/95 backdrop-blur-md border border-slate-700 shadow-2xl rounded-lg px-2.5 py-1.5 flex items-center gap-2 text-xs text-white transform -translate-x-1/2 -translate-y-full transition-opacity duration-150 pointer-events-auto">
    <button onclick="formatSelection('bold')" title="太字 (Bold)" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">B</button>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <button onclick="changeSelectionFontSize(-0.15)" title="選択文字 縮小" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">A-</button>
    <button onclick="changeSelectionFontSize(0.15)" title="選択文字 拡大" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">A+</button>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <!-- 選択文字カラー -->
    <div class="flex items-center gap-1">
      <button onclick="formatSelection('color', '#0f172a')" title="Black" class="w-3.5 h-3.5 rounded-full bg-[#0f172a] ring-1 ring-white/30 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#2563eb')" title="Blue" class="w-3.5 h-3.5 rounded-full bg-[#2563eb] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#10b981')" title="Green" class="w-3.5 h-3.5 rounded-full bg-[#10b981] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#f59e0b')" title="Amber" class="w-3.5 h-3.5 rounded-full bg-[#f59e0b] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#ef4444')" title="Red" class="w-3.5 h-3.5 rounded-full bg-[#ef4444] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
    </div>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <!-- 蛍光ペンハイライト (長方形アイコン・文字なし) -->
    <button onclick="formatSelection('highlight', '#fef08a')" title="マーカー (黄)" class="w-5 h-3.5 rounded-sm bg-[#fef08a] border border-amber-400/80 hover:scale-110 transition-transform shadow-sm"></button>
    <!-- リセット -->
    <button onclick="clearSelectionFormat()" title="書式解除" class="w-5 h-5 flex items-center justify-center text-xs hover:bg-slate-800 rounded text-slate-400 hover:text-white ml-0.5">✕</button>
  </div>

  <!-- スライド一覧コンテナ -->
  <main class="slide-viewport flex flex-col items-center gap-10 p-8 pt-10">

    <!-- Slide 1 (Starter Slide) -->
    <section class="slide w-[1280px] h-[720px] bg-slate-900 text-white rounded-2xl p-16 shadow-2xl relative flex flex-col justify-between overflow-hidden" contenteditable="true">
      <!-- ヘッダーメタ -->
      <div class="flex justify-between items-start gap-6 pb-3 border-b border-slate-800 mb-5 z-10">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-accent-500 flex items-center justify-center font-bold text-sm shadow">
            ANS
          </div>
          <span class="text-sm font-semibold text-slate-300 whitespace-nowrap">AINativeSlide Deck</span>
        </div>
        <div class="shrink-0 whitespace-nowrap px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-mono text-slate-300">
          CONFIDENTIAL
        </div>
      </div>

      <div class="my-auto py-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-lg bg-brand-500/20 border border-brand-500/30 text-brand-300 text-xs font-semibold mb-4">
          プレゼンテーション タイトル
        </div>
        <h1 class="text-5xl font-extrabold tracking-tight leading-tight mb-4 bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">
          スライドメインタイトル
        </h1>
        <p class="text-lg text-slate-400 font-light max-w-2xl leading-relaxed">
          サブタイトルまたは企画の要約文をここに記載します。
        </p>
      </div>

      <div class="flex justify-between items-end pt-6 border-t border-slate-800 text-xs text-slate-500 slide-footer">
        <div>プレゼンテーション資料</div>
        <div class="font-mono">01 / 01</div>
      </div>
    </section>

    <!-- Slide 1 メタ情報欄（AIへの修正指示、印刷時は非表示） -->
    <div class="slide-meta-box no-print w-[1280px] mt-2 mb-8 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3.5 shadow-lg transition-colors focus-within:border-brand-500/80 focus-within:ring-1 focus-within:ring-brand-500/50">
      <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-800/80">
        <div class="flex items-center gap-1.5 text-xs font-semibold text-brand-300">
          <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
          <span class="slide-meta-title">💬 修正指示</span>
        </div>
        <span class="text-[11px] font-mono text-slate-500">Slide 1 / 1</span>
      </div>
      
      <div class="flex items-start gap-2.5">
        <div class="slide-comment-input flex-1 min-h-[38px] max-h-[140px] overflow-y-auto px-3 py-2 bg-slate-950/70 border border-slate-700/60 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-brand-500 leading-relaxed" contenteditable="true" data-placeholder="このスライドの修正・要望を入力（例: 箇条書きを3点から2点に集約、KPI数値を30%に変更、配色のトーンを青系に、等）"></div>
        <button onclick="clearSlideComment(this)" title="指示をクリア" class="text-slate-500 hover:text-rose-400 p-1.5 rounded hover:bg-slate-800 text-xs transition-colors shrink-0">✕</button>
      </div>
    </div>

  </main>

  <script>
    // AINativeSlide Core Runtime Engine (Zero-Dependency, Robust & Fail-safe)
    const isJapanese = !document.documentElement.lang || document.documentElement.lang.toLowerCase().startsWith('ja');

    // 1. 編集モード制御 (ON: 編集可能 / OFF: 閲覧専用・選択不可)
    let isEditable = true;
    function setEditMode(enable) {
      isEditable = !!enable;
      document.body.classList.toggle('is-editable', isEditable);
      document.querySelectorAll('main .slide').forEach(slide => {
        slide.setAttribute('contenteditable', isEditable ? 'true' : 'false');
      });
      const tb = document.getElementById('selectionToolbar');
      if (tb && !isEditable) tb.classList.add('hidden');
      const statusText = document.getElementById('editStatusText');
      const editIcon = document.getElementById('editIcon');
      const toggleBtn = document.getElementById('toggleEditBtn');
      if (statusText) statusText.innerText = isJapanese ? (isEditable ? '編集: ON' : '編集: OFF') : (isEditable ? 'Edit: ON' : 'Edit: OFF');
      if (editIcon) {
        editIcon.classList.toggle('text-brand-400', isEditable);
        editIcon.classList.toggle('text-slate-500', !isEditable);
      }
      if (toggleBtn) {
        toggleBtn.classList.toggle('opacity-60', !isEditable);
        toggleBtn.classList.toggle('border-brand-500/50', isEditable);
      }
      if (!isEditable && window.getSelection) window.getSelection().removeAllRanges();
    }
    function toggleEditMode() { setEditMode(!isEditable); }

    // 2. カスタムカラー適用
    let currentCustomBrandHex = null;
    function applyCustomColor(hex) {
      if (hasTextSelection()) { formatSelection('color', hex); return; }
      currentCustomBrandHex = hex;
      const root = document.documentElement;
      ['--brand-500', '--brand-600'].forEach(p => root.style.setProperty(p, hex));
      root.style.setProperty('--brand-50', hex + '15');
      root.style.setProperty('--brand-100', hex + '25');
      root.style.setProperty('--brand-200', hex + '40');
      if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
    }

    // 3. テキスト選択 & ミニ書式バー
    let savedSelectionRange = null;
    function hasTextSelection() {
      const s = window.getSelection();
      if (!s || !s.rangeCount || s.isCollapsed) return false;
      let node = s.getRangeAt(0).commonAncestorContainer;
      if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
      return !!node.closest('.slide');
    }
    function updateSelectionToolbar() {
      const tb = document.getElementById('selectionToolbar');
      if (!tb) return;
      const s = window.getSelection();
      if (s && s.rangeCount > 0 && !s.isCollapsed) {
        const r = s.getRangeAt(0);
        let node = r.commonAncestorContainer;
        if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
        if (node.closest('.slide')) {
          savedSelectionRange = r.cloneRange();
          const rect = r.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            tb.style.top = `${rect.top + window.scrollY - 12}px`;
            tb.style.left = `${rect.left + window.scrollX + rect.width / 2}px`;
            tb.classList.remove('hidden');
            return;
          }
        }
      }
      tb.classList.add('hidden');
    }
    document.addEventListener('selectionchange', () => setTimeout(updateSelectionToolbar, 20));

    function getActiveRange() {
      const s = window.getSelection();
      if (s && s.rangeCount > 0 && !s.isCollapsed) return s.getRangeAt(0);
      if (savedSelectionRange) {
        s.removeAllRanges();
        s.addRange(savedSelectionRange);
        return savedSelectionRange;
      }
      return null;
    }
    function formatSelection(action, value) {
      const r = getActiveRange();
      if (!r) return;
      if (action === 'bold') {
        document.execCommand('bold', false, null);
        updateSelectionToolbar();
        return;
      }
      const span = document.createElement('span');
      if (action === 'color') span.style.color = value;
      else if (action === 'highlight') span.style.backgroundColor = value;
      try {
        span.appendChild(r.extractContents());
        r.insertNode(span);
        const s = window.getSelection();
        const nr = document.createRange();
        nr.selectNodeContents(span);
        s.removeAllRanges();
        s.addRange(nr);
        savedSelectionRange = nr.cloneRange();
        updateSelectionToolbar();
      } catch (e) { console.error('Format selection error:', e); }
    }
    function changeSelectionFontSize(delta) {
      const r = getActiveRange();
      if (!r) return;
      let node = r.commonAncestorContainer;
      if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
      if (node.tagName === 'SPAN' && node.style.fontSize) {
        const cur = parseFloat(node.style.fontSize) || 1.0;
        node.style.fontSize = `${Math.max(0.6, Math.min(2.5, cur + delta)).toFixed(2)}em`;
      } else {
        const span = document.createElement('span');
        span.style.fontSize = delta > 0 ? '1.25em' : '0.85em';
        try {
          span.appendChild(r.extractContents());
          r.insertNode(span);
          const s = window.getSelection();
          const nr = document.createRange();
          nr.selectNodeContents(span);
          s.removeAllRanges();
          s.addRange(nr);
          savedSelectionRange = nr.cloneRange();
          updateSelectionToolbar();
        } catch (e) { console.error(e); }
      }
    }
    function clearSelectionFormat() {
      if (getActiveRange()) {
        document.execCommand('removeFormat', false, null);
        updateSelectionToolbar();
      }
    }

    // 4. 画像D&D差し替え
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.image-dropzone').forEach(z => {
        z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('ring-2', 'ring-brand-500'); });
        z.addEventListener('dragleave', () => z.classList.remove('ring-2', 'ring-brand-500'));
        z.addEventListener('drop', e => {
          e.preventDefault();
          z.classList.remove('ring-2', 'ring-brand-500');
          const f = e.dataTransfer.files[0];
          if (f && f.type.startsWith('image/')) {
            const r = new FileReader();
            r.onload = ev => { const img = z.querySelector('img'); if (img) img.src = ev.target.result; };
            r.readAsDataURL(f);
          }
        });
      });
    });

    // 5. スライド修正指示処理
    function clearSlideComment(btn) {
      const box = btn.closest('.slide-meta-box, .slide-comment-box');
      if (box) {
        const input = box.querySelector('.slide-comment-input');
        if (input) { input.innerText = ''; input.focus(); }
      }
    }
    function collectSlideComments() {
      const comments = [];
      document.querySelectorAll('.slide-meta-box, .slide-comment-box').forEach((box, idx) => {
        const input = box.querySelector('.slide-comment-input');
        const text = input ? input.innerText.trim() : '';
        if (text) comments.push({ slideNumber: idx + 1, comment: text });
      });
      return comments;
    }
    function copySlideComments() {
      const comments = collectSlideComments();
      const btn = document.getElementById('copyCommentsBtn');
      const origHtml = btn ? btn.innerHTML : '';
      if (comments.length === 0) {
        alert(isJapanese ? '修正指示が入力されていません。\n各スライドの下にある「💬 修正指示」欄に修正要望を入力してください。' : 'No feedback entered. Please type change requests in the feedback boxes.');
        return;
      }
      let text = isJapanese ? '以下のスライド修正指示に基づき、Single-File HTMLコードを改訂してください。指示のないスライドは元の推敲テキストやレイアウトを維持してください。\n\n' : 'Please revise the HTML slides based on the following instructions:\n\n';
      comments.forEach(c => { text += isJapanese ? `【スライド ${c.slideNumber} への修正指示】\n${c.comment}\n\n` : `【Slide ${c.slideNumber} Feedback】\n${c.comment}\n\n`; });
      navigator.clipboard.writeText(text.trim()).then(() => {
        if (btn) {
          btn.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span class="text-emerald-300">${isJapanese ? 'コピー完了!' : 'Copied!'}</span>`;
          setTimeout(() => { btn.innerHTML = origHtml; }, 2500);
        }
      }).catch(() => { prompt(isJapanese ? '以下の修正指示をコピーしてAIに貼り付けてください:' : 'Copy instructions:', text); });
    }

    // 6. 全画面プレゼンテーション
    let isPresentationMode = false;
    let currentPresentationIndex = 0;
    function getMainSlides() { return document.querySelectorAll('main .slide'); }
    function getMostVisibleSlideIndex() {
      const slides = getMainSlides();
      if (!slides.length) return 0;
      let minDiff = Infinity, bestIdx = 0, cy = window.innerHeight / 2;
      slides.forEach((s, idx) => {
        const diff = Math.abs(s.getBoundingClientRect().top + s.getBoundingClientRect().height / 2 - cy);
        if (diff < minDiff) { minDiff = diff; bestIdx = idx; }
      });
      return bestIdx;
    }
    function startPresentation(startIndex) {
      const slides = getMainSlides();
      if (!slides.length) return;
      currentPresentationIndex = typeof startIndex === 'number' ? Math.max(0, Math.min(slides.length - 1, startIndex)) : getMostVisibleSlideIndex();
      const modal = document.getElementById('presentationModal');
      if (modal) { modal.classList.remove('hidden'); isPresentationMode = true; }
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      renderPresentationSlide();
    }
    function stopPresentation() {
      const modal = document.getElementById('presentationModal');
      if (modal) modal.classList.add('hidden');
      isPresentationMode = false;
      const stage = document.getElementById('presentationStage');
      if (stage) stage.innerHTML = '';
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
    function fitPresentationSlide() {
      const stage = document.getElementById('presentationStage');
      if (!stage) return;
      const s = stage.querySelector('.slide');
      if (!s) return;
      let sw = 1280, sh = 720;
      if (s.classList.contains('w-[840px]') || s.classList.contains('h-[1188px]') || s.classList.contains('h-[1123px]')) { sw = 840; sh = 1188; }
      else if (s.classList.contains('w-[1188px]') || s.classList.contains('h-[840px]')) { sw = 1188; sh = 840; }
      else if (s.classList.contains('w-[1024px]') || s.classList.contains('h-[768px]')) { sw = 1024; sh = 768; }
      else { sw = s.offsetWidth || 1280; sh = s.offsetHeight || 720; }
      const scale = Math.min((window.innerWidth - 32) / sw, (window.innerHeight - 32) / sh);
      stage.style.transform = `scale(${Math.max(0.15, scale)})`;
      stage.style.transformOrigin = 'center center';
    }
    function renderPresentationSlide() {
      const slides = getMainSlides();
      if (!slides.length) return;
      currentPresentationIndex = Math.max(0, Math.min(slides.length - 1, currentPresentationIndex));
      const stage = document.getElementById('presentationStage');
      if (!stage) return;
      stage.innerHTML = '';
      const clone = slides[currentPresentationIndex].cloneNode(true);
      clone.setAttribute('contenteditable', 'false');
      clone.style.margin = '0';
      clone.style.boxShadow = '0 25px 60px -15px rgba(0, 0, 0, 0.8)';
      stage.appendChild(clone);
      const counter = document.getElementById('presentationCounter');
      if (counter) counter.innerText = `${currentPresentationIndex + 1} / ${slides.length}`;
      fitPresentationSlide();
    }
    function nextSlide() { if (currentPresentationIndex < getMainSlides().length - 1) { currentPresentationIndex++; renderPresentationSlide(); } }
    function prevSlide() { if (currentPresentationIndex > 0) { currentPresentationIndex--; renderPresentationSlide(); } }
    function firstSlide() { if (getMainSlides().length > 0) { currentPresentationIndex = 0; renderPresentationSlide(); } }
    function lastSlide() { const s = getMainSlides(); if (s.length > 0) { currentPresentationIndex = s.length - 1; renderPresentationSlide(); } }
    function handleStageClick(e) {
      if (!isPresentationMode || e.target.closest('button')) return;
      if (e.clientX < window.innerWidth * 0.25) prevSlide();
      else nextSlide();
    }

    // 7. キーボードショートカット & リサイズ
    document.addEventListener('keydown', e => {
      const isEditing = ['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable;
      if (e.key === 'Escape') { if (isPresentationMode) { stopPresentation(); e.preventDefault(); } return; }
      if (e.key === 'F5') { e.preventDefault(); isPresentationMode ? stopPresentation() : startPresentation(); return; }
      if (isEditing) return;
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); isPresentationMode ? stopPresentation() : startPresentation(); }
      else if (!isPresentationMode && (e.key === 'e' || e.key === 'E')) { e.preventDefault(); toggleEditMode(); }
      else if (isPresentationMode) {
        if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); nextSlide(); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); prevSlide(); }
        else if (e.key === 'Home') { e.preventDefault(); firstSlide(); }
        else if (e.key === 'End') { e.preventDefault(); lastSlide(); }
      }
    });
    window.addEventListener('resize', () => { if (isPresentationMode) fitPresentationSlide(); });

    // 8. 多言語自動同期
    function applyAutoLocalization() {
      const total = document.querySelectorAll('main .slide').length;
      const countEl = document.getElementById('deckSlideCountText');
      if (countEl) countEl.innerText = isJapanese ? `全${total}スライド` : (total === 1 ? '1 Slide' : `${total} Slides`);
      if (isJapanese) return;
      const titleEl = document.getElementById('deckTitleText');
      if (titleEl && titleEl.innerText.trim() === 'スライドタイトル') {
        const h = document.querySelector('.slide h1, .slide h2');
        if (h) titleEl.innerText = h.innerText.trim().replace(/\s+/g, ' ');
      }
      const ratioEl = document.getElementById('deckRatioText');
      if (ratioEl) ratioEl.innerText = ratioEl.innerText.replace('ワイド', 'Widescreen').replace('スタンダード', 'Standard');
      document.querySelectorAll('header span').forEach(el => {
        const m = { '指示をコピー': 'Copy Feedback', '全画面発表': 'Present', 'PDF保存': 'Save PDF' };
        if (m[el.innerText.trim()]) el.innerText = m[el.innerText.trim()];
      });
      const st = document.getElementById('editStatusText');
      if (st) st.innerText = isEditable ? 'Edit: ON' : 'Edit: OFF';
      document.querySelectorAll('.slide-comment-input').forEach(el => el.setAttribute('data-placeholder', 'Enter revision feedback for this slide...'));
    }

    // 9. LocalStorage 自動保存 & 復元 (サンドボックス安全)
    const STORAGE_PREFIX = 'ainativeslide_autosave_';
    function isStorageAvailable() {
      try { const k = '__storage_test__'; localStorage.setItem(k, k); localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    }
    function getStorageKey() {
      try { return STORAGE_PREFIX + (window.location.pathname || 'deck').replace(/[^a-zA-Z0-9_-]/g, '_'); }
      catch (e) { return STORAGE_PREFIX + 'deck'; }
    }
    let saveDebounceTimer = null;
    function scheduleAutoSave() {
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(performAutoSave, 400);
    }
    function performAutoSave() {
      if (!isStorageAvailable()) return;
      try {
        const slides = [];
        document.querySelectorAll('main .slide').forEach(s => slides.push(s.innerHTML));
        const comments = [];
        document.querySelectorAll('.slide-meta-box, .slide-comment-box').forEach(b => {
          const c = b.querySelector('.slide-comment-input');
          comments.push(c ? c.innerText : '');
        });
        localStorage.setItem(getStorageKey(), JSON.stringify({ slides, comments, customHex: currentCustomBrandHex, updatedAt: Date.now() }));
      } catch (e) { console.warn('AutoSave failed:', e); }
    }
    function restoreFromStorage() {
      if (!isStorageAvailable()) return;
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.slides)) {
          const slides = document.querySelectorAll('main .slide');
          data.slides.forEach((html, i) => { if (slides[i] && html) slides[i].innerHTML = html; });
        }
        if (data && Array.isArray(data.comments)) {
          document.querySelectorAll('.slide-meta-box, .slide-comment-box').forEach((b, i) => {
            const c = b.querySelector('.slide-comment-input');
            if (c && typeof data.comments[i] === 'string') c.innerText = data.comments[i];
          });
        }
        if (data && data.customHex && typeof applyCustomColor === 'function') applyCustomColor(data.customHex);
      } catch (e) { console.warn('Restore failed:', e); }
    }
    function resetSavedChanges() {
      if (confirm(isJapanese ? '保存された推敲テキストをすべて破棄し、初期HTMLの状態に戻しますか？' : 'Discard all saved edits?')) {
        if (isStorageAvailable()) { try { localStorage.removeItem(getStorageKey()); } catch (e) {} }
        location.reload();
      }
    }
    function setupAutoSaveListeners() {
      document.addEventListener('input', e => {
        if (e.target.closest('.slide, .slide-meta-box, .slide-comment-box')) scheduleAutoSave();
      });
    }

    // 10. 初期化実行（独立 try-catch による耐障害性保証）
    document.addEventListener('DOMContentLoaded', () => {
      try { restoreFromStorage(); } catch (e) { console.warn('restore error:', e); }
      try { applyAutoLocalization(); } catch (e) { console.warn('localization error:', e); }
      try { setupAutoSaveListeners(); } catch (e) { console.warn('autosave error:', e); }
      try { setEditMode(true); } catch (e) { console.warn('setEditMode error:', e); }
    });
  </script>
</body>
</html>
