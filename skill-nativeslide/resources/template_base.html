<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スライドプレゼンテーション</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: 'var(--brand-50, #eef2ff)',
              100: 'var(--brand-100, #e0e7ff)',
              200: 'var(--brand-200, #c7d2fe)',
              500: 'var(--brand-500, #6366f1)',
              600: 'var(--brand-600, #4f46e5)',
              700: 'var(--brand-700, #4338ca)',
              900: 'var(--brand-900, #312e81)',
              950: 'var(--brand-950, #1e1b4b)',
            },
            accent: {
              400: 'var(--accent-400, #38bdf8)',
              500: 'var(--accent-500, #0ea5e9)',
              600: 'var(--accent-600, #0284c7)',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* CSS変数による動的カラー制御（デフォルト: Indigo） */
    :root {
      --brand-50: #eef2ff;
      --brand-100: #e0e7ff;
      --brand-200: #c7d2fe;
      --brand-500: #6366f1;
      --brand-600: #4f46e5;
      --brand-700: #4338ca;
      --brand-900: #312e81;
      --brand-950: #1e1b4b;
      --accent-400: #38bdf8;
      --accent-500: #0ea5e9;
      --accent-600: #0284c7;
    }

    /* 【比率設定】16:9 の場合 (4:3の場合は size: 4in 3in; .slide: width: 1024px; height: 768px;) */
    @page {
      size: 16in 9in;
      margin: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0f172a;
    }

    /* 印刷時の設定（余白ゼロ・改ページずれゼロ） */
    @media print {
      body {
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .slide-viewport {
        padding: 0 !important;
        gap: 0 !important;
        display: block !important;
      }
      .slide {
        width: 16in !important;
        height: 9in !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }

    /* 画面表示時のスライドボックス (16:9: 1280 x 720 / 4:3: 1024 x 768) */
    .slide {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      background-color: #ffffff;
      outline: none;
    }

    /* 編集可能モードのアウトライン視覚化 */
    [contenteditable="true"]:focus {
      outline: 2px solid var(--brand-500, #6366f1);
      outline-offset: -2px;
    }

    /* スライドコメント（修正指示）＆ 発表メモ入力ボックス */
    .slide-comment-input:empty:before,
    .slide-note-input:empty:before {
      content: attr(data-placeholder);
      color: #64748b;
      pointer-events: none;
    }
    .slide-comment-input:focus:empty:before,
    .slide-note-input:focus:empty:before {
      color: #475569;
    }
    @media print {
      .slide-meta-box,
      .slide-comment-box,
      #tocDrawer,
      #tocBackdrop,
      #presentationModal {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 selection:bg-brand-500 selection:text-white pb-20">

  <!-- 固定操作ツールバー（印刷時は非表示） -->
  <header class="no-print sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-white px-6 py-2.5 shadow-lg flex items-center justify-between">
    <!-- 左側: タイトル & メタ情報 -->
    <div class="flex items-center gap-3">
      <!-- 目次ナビゲーショントグルボタン -->
      <button onclick="toggleTocDrawer()" title="目次・スライド一覧を開く" class="px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center gap-1.5 active:scale-95">
        <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
        <span>目次</span>
      </button>

      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-accent-500 font-bold text-sm shadow">
        NS
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-wide">スライドタイトル</h1>
        <div class="flex items-center gap-2 text-[11px] text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span>16:9 ワイド (1280 × 720)</span>
        </div>
      </div>
    </div>

    <!-- 右側: スタイル操作 & 出力コントローラー群 -->
    <div class="flex items-center gap-3">
      <!-- 1. フォントサイズ変更コントローラー -->
      <div class="flex items-center bg-slate-800/90 border border-slate-700 rounded-lg p-1 text-xs">
        <button onclick="changeFontScale(-0.05)" title="文字サイズ縮小" class="px-2 py-0.5 rounded hover:bg-slate-700 text-slate-300 font-bold transition-all active:scale-95">A-</button>
        <button onclick="resetFontScale()" title="100%にリセット" id="fontScaleText" class="px-1.5 py-0.5 text-slate-200 font-mono font-medium hover:text-white transition-colors">100%</button>
        <button onclick="changeFontScale(0.05)" title="文字サイズ拡大" class="px-2 py-0.5 rounded hover:bg-slate-700 text-slate-300 font-bold transition-all active:scale-95">A+</button>
      </div>

      <!-- 2. テーマカラーパレット切替UI -->
      <div class="flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 rounded-lg px-2 py-1">
        <span class="text-[11px] text-slate-400 mr-0.5">テーマ:</span>
        <button onclick="applyColorPreset('indigo')" title="Indigo (モダンテック)" class="w-4 h-4 rounded-full bg-[#6366f1] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
        <button onclick="applyColorPreset('navy')" title="Navy (堅実コーポレート)" class="w-4 h-4 rounded-full bg-[#2563eb] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
        <button onclick="applyColorPreset('emerald')" title="Emerald (サステナビリティ)" class="w-4 h-4 rounded-full bg-[#10b981] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
        <button onclick="applyColorPreset('amber')" title="Amber (エネルギー)" class="w-4 h-4 rounded-full bg-[#f59e0b] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
        <button onclick="applyColorPreset('rose')" title="Rose (インパクト)" class="w-4 h-4 rounded-full bg-[#f43f5e] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
        <!-- カスタムカラーピッカー -->
        <label title="カスタムカラー選択" class="relative flex items-center cursor-pointer ml-0.5">
          <input type="color" onchange="applyCustomColor(this.value)" value="#6366f1" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
          <div class="w-4 h-4 rounded-full bg-gradient-to-tr from-rose-400 via-emerald-400 to-sky-400 ring-1 ring-white/30 hover:scale-110 transition-transform"></div>
        </label>
      </div>

      <!-- 3. 反復修正指示アクション（エージェント連携） -->
      <div class="flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 rounded-lg p-1 text-xs">
        <button id="copyCommentsBtn" onclick="copySlideComments()" title="入力された全スライドの修正指示をコピーしてChatGPTに貼り付け" class="px-2.5 py-1 rounded bg-slate-700/80 hover:bg-brand-600 hover:text-white text-slate-200 font-medium transition-all flex items-center gap-1 active:scale-95">
          <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          <span>指示をコピー</span>
        </button>
        <button onclick="downloadHtmlWithComments()" title="修正指示・推敲内容を含んだ最新HTMLファイルをダウンロード" class="px-2.5 py-1 rounded hover:bg-slate-700 text-slate-300 font-medium transition-colors flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>HTML保存</span>
        </button>
      </div>

      <!-- 4. 全画面プレゼンテーションモード（スライドショー） -->
      <button onclick="startPresentation()" title="全画面スライドショー開始 (ショートカット: F)" class="px-3 py-1.5 rounded-lg bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center gap-1.5 active:scale-95">
        <span class="text-emerald-400 text-xs">▶</span>
        <span>発表</span>
        <kbd class="hidden md:inline-block px-1.5 py-0.2 text-[10px] font-mono bg-slate-950 text-slate-400 rounded border border-slate-700">F</kbd>
      </button>

      <!-- 5. 編集モード切替 -->
      <button id="toggleEditBtn" onclick="toggleEditMode()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-all flex items-center gap-1.5">
        <svg id="editIcon" class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span id="editStatusText">編集モード: ON</span>
      </button>

      <!-- 6. PDF保存ボタン -->
      <button onclick="window.print()" class="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-brand-600 to-accent-600 hover:from-brand-500 hover:to-accent-500 text-white text-xs font-semibold shadow-md shadow-brand-500/20 transition-all flex items-center gap-1.5 active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
        <span>PDF保存</span>
      </button>
    </div>
  </header>

  <!-- 目次サイドドロワー（印刷時は非表示） -->
  <div id="tocBackdrop" onclick="toggleTocDrawer(false)" class="no-print fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden transition-opacity"></div>
  <aside id="tocDrawer" class="no-print fixed inset-y-0 left-0 w-80 bg-slate-900/95 backdrop-blur-xl border-r border-slate-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-brand-400 font-bold text-base">☰</span>
        <h2 class="text-sm font-bold text-white tracking-wide">スライド目次・一覧</h2>
      </div>
      <button onclick="toggleTocDrawer(false)" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800 text-sm">✕</button>
    </div>
    <div id="tocList" class="flex-1 overflow-y-auto p-4 space-y-2">
      <!-- スクリプトで動的生成 -->
    </div>
    <div class="p-3 border-t border-slate-800/80 text-[11px] text-slate-500 text-center">
      クリックでスライドへジャンプ
    </div>
  </aside>

  <!-- 全画面プレゼンテーションモーダル（印刷時は非表示） -->
  <div id="presentationModal" class="no-print fixed inset-0 bg-black z-50 hidden select-none flex flex-col justify-center items-center overflow-hidden">
    <!-- スライド描画ステージ -->
    <div id="presentationStageWrapper" onclick="handleStageClick(event)" class="relative flex items-center justify-center w-full h-full cursor-pointer">
      <div id="presentationStage" class="transition-transform duration-100 ease-out origin-center"></div>
    </div>

    <!-- レーザーポインター要素 -->
    <div id="laserPointer" class="hidden pointer-events-none fixed w-3.5 h-3.5 bg-rose-500 rounded-full shadow-[0_0_12px_4px_rgba(244,63,94,0.9)] -translate-x-1/2 -translate-y-1/2 z-[60]"></div>

    <!-- 発表者メモオーバーレイパネル -->
    <div id="speakerNotesOverlay" class="hidden absolute bottom-16 left-1/2 -translate-x-1/2 w-11/12 max-w-3xl bg-slate-950/90 backdrop-blur-md border border-slate-700/80 rounded-xl p-4 shadow-2xl z-50 text-slate-100 transition-all">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
        <div class="flex items-center gap-2 text-xs font-bold text-amber-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
          <span id="speakerNotesTitle">🎤 発表メモ (Slide 1)</span>
        </div>
        <span class="text-[11px] text-slate-400">[N] キーで閉じる</span>
      </div>
      <div id="speakerNotesText" class="text-sm leading-relaxed text-slate-200 max-h-36 overflow-y-auto whitespace-pre-wrap font-sans"></div>
    </div>

    <!-- 下部フローティングコントローラーバー -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 rounded-full px-4 py-1.5 shadow-2xl flex items-center gap-3 text-xs text-white opacity-40 hover:opacity-100 transition-opacity">
      <button onclick="prevSlide()" title="前のスライド (← / ↑ / PageUp)" class="p-1.5 hover:bg-slate-700 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span id="presentationCounter" class="font-mono text-xs text-slate-300 min-w-[50px] text-center">1 / 1</span>
      <button onclick="nextSlide()" title="次のスライド (→ / ↓ / Space / PageDown)" class="p-1.5 hover:bg-slate-700 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="w-px h-4 bg-slate-700"></div>
      <button id="laserBtn" onclick="toggleLaser()" title="レーザーポインター (L)" class="px-2.5 py-1 rounded-full text-[11px] font-medium hover:bg-slate-700 text-slate-300 flex items-center gap-1 transition-colors">
        <span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
        <span>レーザー (L)</span>
      </button>
      <button id="noteBtn" onclick="toggleSpeakerNotes()" title="発表メモ表示 (N)" class="px-2.5 py-1 rounded-full text-[11px] font-medium hover:bg-slate-700 text-slate-300 flex items-center gap-1 transition-colors">
        <span>🎤 メモ (N)</span>
      </button>
      <div class="w-px h-4 bg-slate-700"></div>
      <button onclick="stopPresentation()" title="発表終了 (Esc)" class="p-1.5 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- テキスト選択時ミニフローティング書式バー（印刷時は非表示） -->
  <div id="selectionToolbar" class="no-print absolute hidden z-50 bg-slate-900/95 backdrop-blur-md border border-slate-700 shadow-2xl rounded-lg px-2.5 py-1.5 flex items-center gap-2 text-xs text-white transform -translate-x-1/2 -translate-y-full transition-opacity duration-150 pointer-events-auto">
    <button onclick="formatSelection('bold')" title="太字 (Bold)" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">B</button>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <button onclick="changeSelectionFontSize(-0.15)" title="選択文字 縮小" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">A-</button>
    <button onclick="changeSelectionFontSize(0.15)" title="選択文字 拡大" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">A+</button>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <!-- 選択文字カラー -->
    <div class="flex items-center gap-1">
      <button onclick="formatSelection('color', '#6366f1')" title="Indigo" class="w-3.5 h-3.5 rounded-full bg-[#6366f1] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#2563eb')" title="Blue" class="w-3.5 h-3.5 rounded-full bg-[#2563eb] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#10b981')" title="Green" class="w-3.5 h-3.5 rounded-full bg-[#10b981] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#f59e0b')" title="Amber" class="w-3.5 h-3.5 rounded-full bg-[#f59e0b] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#ef4444')" title="Red" class="w-3.5 h-3.5 rounded-full bg-[#ef4444] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
    </div>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <!-- 蛍光ペンハイライト -->
    <button onclick="formatSelection('highlight', '#fef08a')" title="黄色マーカー" class="px-1.5 py-0.5 rounded text-[11px] font-bold bg-amber-300 text-slate-900 hover:bg-amber-200 transition-colors">蛍光黄</button>
    <button onclick="formatSelection('highlight', '#a7f3d0')" title="緑色マーカー" class="px-1.5 py-0.5 rounded text-[11px] font-bold bg-emerald-300 text-slate-900 hover:bg-emerald-200 transition-colors">蛍光緑</button>
    <!-- リセット -->
    <button onclick="clearSelectionFormat()" title="書式解除" class="w-5 h-5 flex items-center justify-center text-xs hover:bg-slate-800 rounded text-slate-400 hover:text-white ml-0.5">✕</button>
  </div>

  <!-- スライド一覧コンテナ -->
  <main class="slide-viewport flex flex-col items-center gap-10 p-8 pt-10">

    <!-- 
      各スライドの構成例:
      <section class="slide w-[1280px] h-[720px] bg-slate-900 text-white rounded-2xl p-16 shadow-2xl relative flex flex-col justify-between overflow-hidden" contenteditable="true">
        ...スライドコンテンツ...
      </section>

      <!-- スライド 1 メタ情報欄（修正指示 & 発表メモ、印刷時は非表示） -->
      <div class="slide-meta-box no-print w-[1280px] mt-2 mb-8 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3.5 shadow-lg transition-colors focus-within:border-brand-500/80 focus-within:ring-1 focus-within:ring-brand-500/50">
        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-800/80">
          <div class="flex items-center gap-2">
            <button onclick="switchMetaTab(this, 'comment')" class="tab-btn-comment active px-2.5 py-1 rounded text-xs font-semibold bg-brand-600/30 text-brand-300 border border-brand-500/40 flex items-center gap-1.5 transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
              <span>💬 修正指示</span>
            </button>
            <button onclick="switchMetaTab(this, 'note')" class="tab-btn-note px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              <span>🎤 発表メモ</span>
            </button>
          </div>
          <span class="text-[11px] font-mono text-slate-500">Slide 1</span>
        </div>
        
        <!-- 修正指示ペイン -->
        <div class="meta-pane meta-pane-comment flex items-start gap-2.5">
          <div class="slide-comment-input flex-1 min-h-[38px] max-h-[140px] overflow-y-auto px-3 py-2 bg-slate-950/70 border border-slate-700/60 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-brand-500 leading-relaxed" contenteditable="true" data-placeholder="このスライドの修正・要望を入力（例: 箇条書きを3点から2点に集約、KPI数値を30%に変更、配色のトーンを青系に、等）"></div>
          <button onclick="clearMetaField(this, '.slide-comment-input')" title="指示をクリア" class="text-slate-500 hover:text-rose-400 p-1.5 rounded hover:bg-slate-800 text-xs transition-colors shrink-0">✕</button>
        </div>

        <!-- 発表メモペイン（初期非表示） -->
        <div class="meta-pane meta-pane-note hidden flex items-start gap-2.5">
          <div class="slide-note-input flex-1 min-h-[38px] max-h-[140px] overflow-y-auto px-3 py-2 bg-slate-950/70 border border-slate-700/60 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-brand-500 leading-relaxed" contenteditable="true" data-placeholder="発表時のトーク原稿・補足メモを入力（スライドショー投影時に [N] キーで画面下部に表示されます）"></div>
          <button onclick="clearMetaField(this, '.slide-note-input')" title="メモをクリア" class="text-slate-500 hover:text-rose-400 p-1.5 rounded hover:bg-slate-800 text-xs transition-colors shrink-0">✕</button>
        </div>
      </div>
    -->

  </main>

  <script>
    // ----------------------------------------------------
    // 1. 編集モードトグル
    // ----------------------------------------------------
    let isEditable = true;
    function toggleEditMode() {
      isEditable = !isEditable;
      const slides = document.querySelectorAll('.slide');
      slides.forEach(slide => {
        slide.setAttribute('contenteditable', isEditable ? 'true' : 'false');
      });
      const statusText = document.getElementById('editStatusText');
      const editIcon = document.getElementById('editIcon');
      if (isEditable) {
        statusText.innerText = '編集モード: ON';
        editIcon.classList.add('text-brand-400');
        editIcon.classList.remove('text-slate-400');
      } else {
        statusText.innerText = '編集モード: OFF (プレビュー)';
        editIcon.classList.remove('text-brand-400');
        editIcon.classList.add('text-slate-400');
      }
    }

    // ----------------------------------------------------
    // 2. フォントサイズ動的スケーリング (全体 or 選択箇所)
    // ----------------------------------------------------
    let currentFontScale = 1.0;
    function changeFontScale(delta) {
      if (hasTextSelection()) {
        changeSelectionFontSize(delta > 0 ? 0.2 : -0.2);
        return;
      }
      currentFontScale = Math.min(1.25, Math.max(0.85, parseFloat((currentFontScale + delta).toFixed(2))));
      applyFontScale();
    }
    function resetFontScale() {
      if (hasTextSelection()) {
        clearSelectionFormat();
        return;
      }
      currentFontScale = 1.0;
      applyFontScale();
    }
    function applyFontScale() {
      document.getElementById('fontScaleText').innerText = Math.round(currentFontScale * 100) + '%';
      let styleTag = document.getElementById('slide-font-scale-style');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'slide-font-scale-style';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = `
        .slide h1 { font-size: calc(3rem * ${currentFontScale}) !important; line-height: 1.15 !important; }
        .slide h2 { font-size: calc(1.5rem * ${currentFontScale}) !important; line-height: 1.25 !important; }
        .slide h3 { font-size: calc(1rem * ${currentFontScale}) !important; }
        .slide h4 { font-size: calc(0.875rem * ${currentFontScale}) !important; }
        .slide p, .slide ul, .slide ol { font-size: calc(0.875rem * ${currentFontScale}) !important; line-height: 1.6 !important; }
        .slide .text-xs { font-size: calc(0.75rem * ${currentFontScale}) !important; }
        .slide .text-sm { font-size: calc(0.875rem * ${currentFontScale}) !important; }
        .slide .text-base { font-size: calc(1rem * ${currentFontScale}) !important; }
      `;
    }

    // ----------------------------------------------------
    // 3. テーマカラー適用 (全体 or 選択箇所)
    // ----------------------------------------------------
    const themePresets = {
      indigo: {
        brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81', 950: '#1e1b4b' },
        accent: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' }
      },
      navy: {
        brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 900: '#1e3a8a', 950: '#172554' },
        accent: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
      },
      emerald: {
        brand: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b', 950: '#022c22' },
        accent: { 400: '#34d399', 500: '#10b981', 600: '#059669' }
      },
      amber: {
        brand: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 900: '#78350f', 950: '#451a03' },
        accent: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
      },
      rose: {
        brand: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c', 900: '#881337', 950: '#4c0519' },
        accent: { 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48' }
      }
    };

    function applyColorPreset(presetKey) {
      const preset = themePresets[presetKey];
      if (!preset) return;
      if (hasTextSelection()) {
        formatSelection('color', preset.brand[500]);
        return;
      }
      const root = document.documentElement;
      Object.entries(preset.brand).forEach(([k, v]) => root.style.setProperty(`--brand-${k}`, v));
      Object.entries(preset.accent).forEach(([k, v]) => root.style.setProperty(`--accent-${k}`, v));
    }

    function applyCustomColor(hex) {
      if (hasTextSelection()) {
        formatSelection('color', hex);
        return;
      }
      const root = document.documentElement;
      root.style.setProperty('--brand-500', hex);
      root.style.setProperty('--brand-600', hex);
      root.style.setProperty('--brand-50', hex + '15');
      root.style.setProperty('--brand-100', hex + '25');
      root.style.setProperty('--brand-200', hex + '40');
    }

    // ----------------------------------------------------
    // 4. テキスト選択の判定 & ミニフローティングバー
    // ----------------------------------------------------
    let savedSelectionRange = null;

    function hasTextSelection() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return false;
      const range = selection.getRangeAt(0);
      let container = range.commonAncestorContainer;
      if (container.nodeType === Node.TEXT_NODE) container = container.parentNode;
      return !!container.closest('.slide');
    }

    function updateSelectionToolbar() {
      const toolbar = document.getElementById('selectionToolbar');
      if (!toolbar) return;
      const selection = window.getSelection();
      if (selection.rangeCount > 0 && !selection.isCollapsed) {
        const range = selection.getRangeAt(0);
        let container = range.commonAncestorContainer;
        if (container.nodeType === Node.TEXT_NODE) container = container.parentNode;
        if (container.closest('.slide')) {
          savedSelectionRange = range.cloneRange();
          const rect = range.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            toolbar.style.top = `${rect.top + window.scrollY - 12}px`;
            toolbar.style.left = `${rect.left + window.scrollX + rect.width / 2}px`;
            toolbar.classList.remove('hidden');
            return;
          }
        }
      }
      toolbar.classList.add('hidden');
    }

    document.addEventListener('selectionchange', () => {
      setTimeout(updateSelectionToolbar, 20);
    });

    document.addEventListener('mousedown', (e) => {
      const toolbar = document.getElementById('selectionToolbar');
      if (toolbar && !toolbar.contains(e.target) && !e.target.closest('header')) {
        // スライド内のテキスト以外のクリック時
      }
    });

    // ----------------------------------------------------
    // 5. 選択テキストへのインライン書式適用
    // ----------------------------------------------------
    function getActiveRange() {
      const selection = window.getSelection();
      if (selection.rangeCount > 0 && !selection.isCollapsed) {
        return selection.getRangeAt(0);
      }
      if (savedSelectionRange) {
        selection.removeAllRanges();
        selection.addRange(savedSelectionRange);
        return savedSelectionRange;
      }
      return null;
    }

    function formatSelection(action, value) {
      const range = getActiveRange();
      if (!range) return;

      if (action === 'bold') {
        document.execCommand('bold', false, null);
        updateSelectionToolbar();
        return;
      }

      const span = document.createElement('span');
      if (action === 'color') {
        span.style.color = value;
      } else if (action === 'highlight') {
        span.style.backgroundColor = value;
        span.style.color = '#0f172a';
        span.style.padding = '0.1em 0.35em';
        span.style.borderRadius = '0.25em';
        span.style.fontWeight = '600';
      }

      try {
        const contents = range.extractContents();
        span.appendChild(contents);
        range.insertNode(span);

        const selection = window.getSelection();
        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        selection.removeAllRanges();
        selection.addRange(newRange);
        savedSelectionRange = newRange.cloneRange();
        updateSelectionToolbar();
      } catch (e) {
        console.error('Format selection error:', e);
      }
    }

    function changeSelectionFontSize(delta) {
      const range = getActiveRange();
      if (!range) return;

      let container = range.commonAncestorContainer;
      if (container.nodeType === Node.TEXT_NODE) container = container.parentNode;

      if (container.tagName === 'SPAN' && container.style.fontSize) {
        let currentEm = parseFloat(container.style.fontSize) || 1.0;
        container.style.fontSize = `${Math.max(0.6, Math.min(2.5, currentEm + delta)).toFixed(2)}em`;
      } else {
        const span = document.createElement('span');
        span.style.fontSize = delta > 0 ? '1.25em' : '0.85em';
        try {
          const contents = range.extractContents();
          span.appendChild(contents);
          range.insertNode(span);
          const selection = window.getSelection();
          const newRange = document.createRange();
          newRange.selectNodeContents(span);
          selection.removeAllRanges();
          selection.addRange(newRange);
          savedSelectionRange = newRange.cloneRange();
          updateSelectionToolbar();
        } catch (e) {
          console.error(e);
        }
      }
    }

    function clearSelectionFormat() {
      const range = getActiveRange();
      if (!range) return;
      document.execCommand('removeFormat', false, null);
      updateSelectionToolbar();
    }

    // ----------------------------------------------------
    // 6. 画像ドラッグ＆ドロップ差し替えスクリプト
    // ----------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      const dropzones = document.querySelectorAll('.image-dropzone');
      dropzones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          zone.classList.add('ring-2', 'ring-brand-500');
        });
        zone.addEventListener('dragleave', () => {
          zone.classList.remove('ring-2', 'ring-brand-500');
        });
        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('ring-2', 'ring-brand-500');
          const file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = zone.querySelector('img');
              if (img) {
                img.src = event.target.result;
              }
            };
            reader.readAsDataURL(file);
          }
        });
      });
    });

    // ----------------------------------------------------
    // 7. スライドメタ情報（修正指示 & 発表メモ）処理
    // ----------------------------------------------------
    function switchMetaTab(btn, tabType) {
      const box = btn.closest('.slide-meta-box');
      if (!box) return;
      const commentBtn = box.querySelector('.tab-btn-comment');
      const noteBtn = box.querySelector('.tab-btn-note');
      const commentPane = box.querySelector('.meta-pane-comment');
      const notePane = box.querySelector('.meta-pane-note');

      if (tabType === 'comment') {
        if (commentBtn) commentBtn.className = 'tab-btn-comment active px-2.5 py-1 rounded text-xs font-semibold bg-brand-600/30 text-brand-300 border border-brand-500/40 flex items-center gap-1.5 transition-all';
        if (noteBtn) noteBtn.className = 'tab-btn-note px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all';
        if (commentPane) commentPane.classList.remove('hidden');
        if (notePane) notePane.classList.add('hidden');
      } else {
        if (noteBtn) noteBtn.className = 'tab-btn-note active px-2.5 py-1 rounded text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center gap-1.5 transition-all';
        if (commentBtn) commentBtn.className = 'tab-btn-comment px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all';
        if (commentPane) commentPane.classList.add('hidden');
        if (notePane) notePane.classList.remove('hidden');
      }
    }

    function clearMetaField(btn, selector) {
      const box = btn.closest('.slide-meta-box, .slide-comment-box');
      if (box) {
        const input = box.querySelector(selector);
        if (input) {
          input.innerText = '';
          input.focus();
        }
      }
    }

    function clearSlideComment(btn) {
      clearMetaField(btn, '.slide-comment-input');
    }

    function collectSlideComments() {
      const boxes = document.querySelectorAll('.slide-meta-box, .slide-comment-box');
      const comments = [];
      boxes.forEach((box, index) => {
        const input = box.querySelector('.slide-comment-input');
        const text = input ? input.innerText.trim() : '';
        if (text) {
          comments.push({
            slideNumber: index + 1,
            comment: text
          });
        }
      });
      return comments;
    }

    function copySlideComments() {
      const comments = collectSlideComments();
      const copyBtn = document.getElementById('copyCommentsBtn');
      const originalHtml = copyBtn ? copyBtn.innerHTML : '';

      if (comments.length === 0) {
        alert('修正指示が入力されていません。\n各スライドの下にある「💬 修正指示」欄に修正要望を入力してください。');
        return;
      }

      let formatted = '以下のスライド修正指示に基づき、Single-File HTMLコードを改訂してください。指示のないスライドは元の推敲テキストやレイアウトを維持してください。\n\n';
      comments.forEach(c => {
        formatted += `【スライド ${c.slideNumber} への修正指示】\n${c.comment}\n\n`;
      });

      navigator.clipboard.writeText(formatted.trim()).then(() => {
        if (copyBtn) {
          copyBtn.innerHTML = `
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span class="text-emerald-300">コピー完了!</span>
          `;
          setTimeout(() => {
            copyBtn.innerHTML = originalHtml;
          }, 2500);
        }
      }).catch(err => {
        console.error('Copy failed:', err);
        prompt('以下の修正指示をコピーしてエージェントに貼り付けてください:', formatted);
      });
    }

    function downloadHtmlWithComments() {
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'slide_with_comments.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ----------------------------------------------------
    // 8. 目次（TOC）ドロワーナビゲーション
    // ----------------------------------------------------
    let isTocOpen = false;

    function initToc() {
      const list = document.getElementById('tocList');
      if (!list) return;
      const slides = document.querySelectorAll('.slide');
      list.innerHTML = '';

      slides.forEach((slide, idx) => {
        const heading = slide.querySelector('h1, h2');
        const title = heading ? heading.innerText.trim().replace(/\s+/g, ' ') : `スライド ${idx + 1}`;
        const item = document.createElement('div');
        const isActive = isPresentationMode ? (currentPresentationIndex === idx) : false;
        
        item.className = `toc-item group flex items-start gap-2.5 p-2.5 rounded-lg border transition-all cursor-pointer ${
          isActive 
            ? 'bg-brand-900/40 border-brand-500/70 text-white' 
            : 'border-slate-800 bg-slate-800/40 hover:bg-slate-800 hover:border-brand-500/50 text-slate-300 hover:text-white'
        }`;
        
        item.onclick = () => {
          if (isPresentationMode) {
            currentPresentationIndex = idx;
            renderPresentationSlide();
          } else {
            slide.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          toggleTocDrawer(false);
        };

        item.innerHTML = `
          <span class="shrink-0 w-6 h-6 rounded bg-slate-700/70 group-hover:bg-brand-600 font-mono text-xs font-bold flex items-center justify-center text-slate-300 group-hover:text-white transition-colors">${idx + 1}</span>
          <span class="text-xs font-medium line-clamp-2 leading-tight pt-0.5">${title}</span>
        `;
        list.appendChild(item);
      });
    }

    function toggleTocDrawer(forceState) {
      const drawer = document.getElementById('tocDrawer');
      const backdrop = document.getElementById('tocBackdrop');
      if (!drawer || !backdrop) return;

      isTocOpen = (typeof forceState === 'boolean') ? forceState : !isTocOpen;

      if (isTocOpen) {
        initToc();
        drawer.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // ----------------------------------------------------
    // 9. 全画面プレゼンテーション（スライドショーモード）
    // ----------------------------------------------------
    let isPresentationMode = false;
    let currentPresentationIndex = 0;

    function getMostVisibleSlideIndex() {
      const slides = document.querySelectorAll('.slide');
      if (!slides.length) return 0;
      let minDiff = Infinity;
      let bestIdx = 0;
      const centerY = window.innerHeight / 2;

      slides.forEach((slide, idx) => {
        const rect = slide.getBoundingClientRect();
        const slideCenterY = rect.top + rect.height / 2;
        const diff = Math.abs(slideCenterY - centerY);
        if (diff < minDiff) {
          minDiff = diff;
          bestIdx = idx;
        }
      });
      return bestIdx;
    }

    function startPresentation(startIndex) {
      const slides = document.querySelectorAll('.slide');
      if (!slides.length) return;

      currentPresentationIndex = (typeof startIndex === 'number') 
        ? Math.max(0, Math.min(slides.length - 1, startIndex)) 
        : getMostVisibleSlideIndex();

      const modal = document.getElementById('presentationModal');
      if (!modal) return;

      modal.classList.remove('hidden');
      isPresentationMode = true;

      // ブラウザフルスクリーンのリクエスト（任意）
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      renderPresentationSlide();
    }

    function stopPresentation() {
      const modal = document.getElementById('presentationModal');
      if (modal) modal.classList.add('hidden');
      isPresentationMode = false;

      // レーザーポインター解除
      if (isLaserActive) toggleLaser();

      // 発表メモ非表示
      const overlay = document.getElementById('speakerNotesOverlay');
      if (overlay) overlay.classList.add('hidden');

      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function fitPresentationSlide() {
      const stage = document.getElementById('presentationStage');
      if (!stage) return;
      const slide = stage.querySelector('.slide');
      if (!slide) return;

      const is43 = slide.classList.contains('w-[1024px]');
      const slideW = is43 ? 1024 : 1280;
      const slideH = is43 ? 768 : 720;
      
      const availW = window.innerWidth;
      const availH = window.innerHeight;
      const scale = Math.min((availW - 32) / slideW, (availH - 32) / slideH);

      stage.style.transform = `scale(${Math.max(0.15, scale)})`;
      stage.style.transformOrigin = 'center center';
    }

    function renderPresentationSlide() {
      const slides = document.querySelectorAll('.slide');
      if (!slides.length) return;
      if (currentPresentationIndex < 0) currentPresentationIndex = 0;
      if (currentPresentationIndex >= slides.length) currentPresentationIndex = slides.length - 1;

      const stage = document.getElementById('presentationStage');
      if (!stage) return;
      stage.innerHTML = '';

      const originalSlide = slides[currentPresentationIndex];
      const clone = originalSlide.cloneNode(true);
      clone.setAttribute('contenteditable', 'false');
      clone.style.margin = '0';
      clone.style.boxShadow = '0 25px 60px -15px rgba(0, 0, 0, 0.8)';
      stage.appendChild(clone);

      const counter = document.getElementById('presentationCounter');
      if (counter) {
        counter.innerText = `${currentPresentationIndex + 1} / ${slides.length}`;
      }

      updateSpeakerNotesContent();
      fitPresentationSlide();
    }

    function nextSlide() {
      const slides = document.querySelectorAll('.slide');
      if (currentPresentationIndex < slides.length - 1) {
        currentPresentationIndex++;
        renderPresentationSlide();
      }
    }

    function prevSlide() {
      if (currentPresentationIndex > 0) {
        currentPresentationIndex--;
        renderPresentationSlide();
      }
    }

    function handleStageClick(event) {
      if (!isPresentationMode) return;
      if (event.target.closest('#speakerNotesOverlay') || event.target.closest('button')) return;

      const x = event.clientX;
      if (x < window.innerWidth * 0.25) {
        prevSlide();
      } else {
        nextSlide();
      }
    }

    // ----------------------------------------------------
    // 10. スピーカーノート（発表メモ）
    // ----------------------------------------------------
    function updateSpeakerNotesContent() {
      const titleEl = document.getElementById('speakerNotesTitle');
      const textEl = document.getElementById('speakerNotesText');
      if (!textEl) return;

      const metaBoxes = document.querySelectorAll('.slide-meta-box');
      const currentBox = metaBoxes[currentPresentationIndex];
      let noteText = '';
      if (currentBox) {
        const noteInput = currentBox.querySelector('.slide-note-input');
        if (noteInput) {
          noteText = noteInput.innerText.trim();
        }
      }

      if (titleEl) {
        titleEl.innerText = `🎤 発表メモ (Slide ${currentPresentationIndex + 1})`;
      }
      if (noteText) {
        textEl.innerText = noteText;
      } else {
        textEl.innerHTML = '<span class="text-slate-500 italic">（このスライドに発表メモは入力されていません）</span>';
      }
    }

    function toggleSpeakerNotes() {
      const overlay = document.getElementById('speakerNotesOverlay');
      const noteBtn = document.getElementById('noteBtn');
      if (!overlay) return;

      const isHidden = overlay.classList.contains('hidden');
      if (isHidden) {
        updateSpeakerNotesContent();
        overlay.classList.remove('hidden');
        if (noteBtn) noteBtn.classList.add('bg-amber-500/30', 'text-amber-300');
      } else {
        overlay.classList.add('hidden');
        if (noteBtn) noteBtn.classList.remove('bg-amber-500/30', 'text-amber-300');
      }
    }

    // ----------------------------------------------------
    // 11. レーザーポインター
    // ----------------------------------------------------
    let isLaserActive = false;

    function toggleLaser() {
      isLaserActive = !isLaserActive;
      const laser = document.getElementById('laserPointer');
      const laserBtn = document.getElementById('laserBtn');
      const modal = document.getElementById('presentationModal');
      if (!laser || !modal) return;

      if (isLaserActive) {
        laser.classList.remove('hidden');
        modal.style.cursor = 'none';
        if (laserBtn) laserBtn.classList.add('bg-rose-600/40', 'text-rose-300');
      } else {
        laser.classList.add('hidden');
        modal.style.cursor = 'default';
        if (laserBtn) laserBtn.classList.remove('bg-rose-600/40', 'text-rose-300');
      }
    }

    document.addEventListener('mousemove', (e) => {
      if (isPresentationMode && isLaserActive) {
        const laser = document.getElementById('laserPointer');
        if (laser) {
          laser.style.left = `${e.clientX}px`;
          laser.style.top = `${e.clientY}px`;
        }
      }
    });

    // ----------------------------------------------------
    // 12. キーボードショートカット & リサイズリスナー
    // ----------------------------------------------------
    document.addEventListener('keydown', (e) => {
      const isEditing = ['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable;

      if (e.key === 'Escape') {
        if (isPresentationMode) {
          stopPresentation();
          e.preventDefault();
        } else if (isTocOpen) {
          toggleTocDrawer(false);
          e.preventDefault();
        }
        return;
      }

      if (isEditing) return;

      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        if (!isPresentationMode) {
          startPresentation();
        } else {
          stopPresentation();
        }
      } else if (isPresentationMode) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          toggleSpeakerNotes();
        } else if (e.key === 'l' || e.key === 'L') {
          e.preventDefault();
          toggleLaser();
        }
      }
    });

    window.addEventListener('resize', () => {
      if (isPresentationMode) {
        fitPresentationSlide();
      }
    });
  </script>
</body>
</html>
