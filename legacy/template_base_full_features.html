<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スライドプレゼンテーション</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: 'var(--brand-50, #eef2ff)',
              100: 'var(--brand-100, #e0e7ff)',
              200: 'var(--brand-200, #c7d2fe)',
              500: 'var(--brand-500, #6366f1)',
              600: 'var(--brand-600, #4f46e5)',
              700: 'var(--brand-700, #4338ca)',
              900: 'var(--brand-900, #312e81)',
              950: 'var(--brand-950, #1e1b4b)',
            },
            accent: {
              400: 'var(--accent-400, #38bdf8)',
              500: 'var(--accent-500, #0ea5e9)',
              600: 'var(--accent-600, #0284c7)',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* CSS変数による動的カラー制御（デフォルト: Indigo） */
    :root {
      --brand-50: #eef2ff;
      --brand-100: #e0e7ff;
      --brand-200: #c7d2fe;
      --brand-500: #6366f1;
      --brand-600: #4f46e5;
      --brand-700: #4338ca;
      --brand-900: #312e81;
      --brand-950: #1e1b4b;
      --accent-400: #38bdf8;
      --accent-500: #0ea5e9;
      --accent-600: #0284c7;
    }

    /* 【比率設定】16:9 の場合 (4:3の場合は size: 4in 3in; .slide: width: 1024px; height: 768px;) */
    @page {
      size: 16in 9in;
      margin: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0f172a;
    }

    /* 印刷時の設定（余白ゼロ・改ページずれゼロ） */
    @media print {
      body {
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .slide-viewport {
        padding: 0 !important;
        gap: 0 !important;
        display: block !important;
      }
      .slide {
        width: 16in !important;
        height: 9in !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }

    /* 画面表示時のスライドボックス (16:9: 1280 x 720 / 4:3: 1024 x 768) */
    .slide {
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 12px;
      background-color: #ffffff;
      outline: none;
    }

    /* 編集可能モードのアウトライン視覚化 */
    [contenteditable="true"]:focus {
      outline: 2px solid var(--brand-500, #6366f1);
      outline-offset: -2px;
    }

    /* スライドコメント（修正指示）＆ 発表メモ入力ボックス */
    .slide-comment-input:empty:before,
    .slide-note-input:empty:before {
      content: attr(data-placeholder);
      color: #64748b;
      pointer-events: none;
    }
    .slide-comment-input:focus:empty:before,
    .slide-note-input:focus:empty:before {
      color: #475569;
    }
    @media print {
      .slide-meta-box,
      .slide-comment-box,
      #tocDrawer,
      #tocBackdrop,
      #presentationModal {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 selection:bg-brand-500 selection:text-white pb-20">

  <!-- 固定操作ツールバー（印刷時は非表示） -->
  <header class="no-print sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white px-6 py-2.5 shadow-lg flex items-center justify-between gap-4 min-h-[56px]">
    <!-- 左側: タイトル & メタ情報 ＋ モード切替タブ（タイトルの右隣に配置して被りを完全防止） -->
    <div class="flex items-center gap-4 shrink-0">
      <!-- 目次ナビゲーショントグルボタン -->
      <button onclick="toggleTocDrawer()" title="目次・スライド一覧を開く" class="px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all flex items-center gap-1.5 active:scale-95">
        <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
        <span>目次</span>
      </button>

      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-accent-500 font-bold text-sm shadow">
        NS
      </div>
      <div>
        <h1 id="deckTitleText" class="text-sm font-semibold tracking-wide max-w-[260px] truncate">スライドタイトル</h1>
        <div class="flex items-center gap-2 text-[11px] text-slate-400">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="deckRatioText">16:9 ワイド (1280 × 720)</span>
          <span class="text-slate-600">|</span>
          <span id="deckSlideCountText">全0スライド</span>
        </div>
      </div>

      <!-- 縦区切り線 -->
      <div class="w-px h-6 bg-slate-800 hidden sm:block"></div>

      <!-- モード切替タブ（スライドタイトルのすぐ右隣に配置） -->
      <div class="flex items-center bg-slate-950/80 p-1 rounded-xl border border-slate-800 shrink-0 shadow-inner">
        <button id="tabBtnEdit" onclick="switchHeaderTab('edit')" class="px-3.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-brand-600 text-white shadow">
          <span>✏️ 編集</span>
        </button>
        <button id="tabBtnPresent" onclick="switchHeaderTab('present')" class="px-3.5 py-1 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200">
          <span>🎬 発表・出力</span>
        </button>
      </div>
    </div>

    <!-- 右側: タブ別コントローラー群 -->
    <div class="flex items-center gap-3 shrink-0 ml-auto">

      <!-- 1. 【編集タブ用コントロール群】 -->
      <div id="headerControlsEdit" class="flex items-center gap-3">
        <!-- 変更保存状態インジケーター & リセット -->
        <div id="saveStatusWrapper" class="hidden md:flex items-center gap-1.5 text-[11px] text-slate-400 bg-slate-800/80 px-2 py-1 rounded-md border border-slate-700/80">
          <span id="saveStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="saveStatusText">自動保存: 有効</span>
          <button id="resetSavedBtn" onclick="resetSavedChanges()" title="保存された推敲・変更を破棄して初期状態に戻す" class="text-slate-500 hover:text-rose-400 ml-1 transition-colors underline underline-offset-2">リセット</button>
        </div>

        <!-- フォントサイズ変更コントローラー -->
        <div class="flex items-center bg-slate-800/90 border border-slate-700 rounded-lg p-1 text-xs">
          <button onclick="changeFontScale(-0.05)" title="文字サイズ縮小" class="px-2 py-0.5 rounded hover:bg-slate-700 text-slate-300 font-bold transition-all active:scale-95">A-</button>
          <button onclick="resetFontScale()" title="100%にリセット" id="fontScaleText" class="px-1.5 py-0.5 text-slate-200 font-mono font-medium hover:text-white transition-colors">100%</button>
          <button onclick="changeFontScale(0.05)" title="文字サイズ拡大" class="px-2 py-0.5 rounded hover:bg-slate-700 text-slate-300 font-bold transition-all active:scale-95">A+</button>
        </div>

        <!-- 反復修正指示アクション（エージェント連携） -->
        <div class="flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 rounded-lg p-1 text-xs">
          <button id="copyCommentsBtn" onclick="copySlideComments()" title="入力された全スライドの修正指示をコピーしてAIに貼り付け" class="px-2.5 py-1 rounded bg-slate-700/80 hover:bg-brand-600 hover:text-white text-slate-200 font-medium transition-all flex items-center gap-1 active:scale-95">
            <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
            <span>指示をコピー</span>
          </button>
          <button onclick="downloadHtmlWithComments()" title="修正指示・推敲内容を含んだ最新HTMLファイルをダウンロード" class="px-2.5 py-1 rounded hover:bg-slate-700 text-slate-300 font-medium transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span>HTML保存</span>
          </button>
        </div>
      </div>

      <!-- 2. 【発表・出力タブ用コントロール群】（初期非表示） -->
      <div id="headerControlsPresent" class="hidden flex items-center gap-3">
        <!-- 編集モード切替（プレビュー切替） -->
        <button id="toggleEditBtn" onclick="toggleEditMode()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-all flex items-center gap-1.5">
          <svg id="editIcon" class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          <span id="editStatusText">編集モード: ON</span>
        </button>

        <!-- 発表者ツール別画面起動 -->
        <button onclick="openSpeakerView()" title="発表者ツール（手元カンペ・次スライド・タイマー）を別ウィンドウで開く (ショートカット: P)" class="px-3 py-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-xs font-bold text-amber-300 transition-all flex items-center gap-1.5 active:scale-95 shadow-sm">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span>発表者ツール</span>
          <kbd class="px-1 py-0.2 text-[10px] font-mono bg-slate-950 text-amber-400/80 rounded border border-amber-500/30">P</kbd>
        </button>

        <!-- 全画面プレゼンテーションモード（スライドショー） -->
        <button onclick="startPresentation()" title="全画面スライドショー開始 (ショートカット: F)" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5 active:scale-95">
          <span class="text-xs">▶</span>
          <span>全画面発表</span>
          <kbd class="px-1 py-0.2 text-[10px] font-mono bg-emerald-950 text-emerald-200 rounded border border-emerald-500/30">F</kbd>
        </button>

        <!-- PDF保存ボタン -->
        <button onclick="window.print()" class="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-brand-600 to-accent-600 hover:from-brand-500 hover:to-accent-500 text-white text-xs font-semibold shadow-md shadow-brand-500/20 transition-all flex items-center gap-1.5 active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          <span>PDF保存</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 目次サイドドロワー（印刷時は非表示） -->
  <div id="tocBackdrop" onclick="toggleTocDrawer(false)" class="no-print fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden transition-opacity"></div>
  <aside id="tocDrawer" class="no-print fixed inset-y-0 left-0 w-80 bg-slate-900/95 backdrop-blur-xl border-r border-slate-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-brand-400 font-bold text-base">☰</span>
        <h2 class="text-sm font-bold text-white tracking-wide">スライド目次・一覧</h2>
      </div>
      <button onclick="toggleTocDrawer(false)" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800 text-sm">✕</button>
    </div>
    <div id="tocList" class="flex-1 overflow-y-auto p-4 space-y-2">
      <!-- スクリプトで動的生成 -->
    </div>
    <div class="p-3 border-t border-slate-800/80 text-[11px] text-slate-500 text-center">
      クリックでスライドへジャンプ
    </div>
  </aside>

  <!-- 全画面プレゼンテーションモーダル（印刷時は非表示） -->
  <div id="presentationModal" class="no-print fixed inset-0 bg-black z-50 hidden select-none flex flex-col justify-center items-center overflow-hidden">
    <!-- スライド描画ステージ -->
    <div id="presentationStageWrapper" onclick="handleStageClick(event)" class="relative flex items-center justify-center w-full h-full cursor-pointer">
      <div id="presentationStage" class="transition-transform duration-100 ease-out origin-center"></div>
    </div>

    <!-- レーザーポインター要素 -->
    <div id="laserPointer" class="hidden pointer-events-none fixed w-3.5 h-3.5 bg-rose-500 rounded-full shadow-[0_0_12px_4px_rgba(244,63,94,0.9)] -translate-x-1/2 -translate-y-1/2 z-[60]"></div>

    <!-- 発表者メモオーバーレイパネル -->
    <div id="speakerNotesOverlay" class="hidden absolute bottom-16 left-1/2 -translate-x-1/2 w-11/12 max-w-3xl bg-slate-950/90 backdrop-blur-md border border-slate-700/80 rounded-xl p-4 shadow-2xl z-50 text-slate-100 transition-all">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
        <div class="flex items-center gap-2 text-xs font-bold text-amber-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
          <span id="speakerNotesTitle">🎤 発表メモ (Slide 1)</span>
        </div>
        <span class="text-[11px] text-slate-400">[N] キーで閉じる</span>
      </div>
      <div id="speakerNotesText" class="text-sm leading-relaxed text-slate-200 max-h-36 overflow-y-auto whitespace-pre-wrap font-sans"></div>
    </div>

    <!-- 下部フローティングコントローラーバー -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 rounded-full px-4 py-1.5 shadow-2xl flex items-center gap-3 text-xs text-white opacity-40 hover:opacity-100 transition-opacity">
      <button onclick="prevSlide()" title="前のスライド (← / ↑ / PageUp)" class="p-1.5 hover:bg-slate-700 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span id="presentationCounter" class="font-mono text-xs text-slate-300 min-w-[50px] text-center">1 / 1</span>
      <button onclick="nextSlide()" title="次のスライド (→ / ↓ / Space / PageDown)" class="p-1.5 hover:bg-slate-700 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="w-px h-4 bg-slate-700"></div>
      <button id="laserBtn" onclick="toggleLaser()" title="レーザーポインター (L)" class="px-2.5 py-1 rounded-full text-[11px] font-medium hover:bg-slate-700 text-slate-300 flex items-center gap-1 transition-colors">
        <span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
        <span>レーザー (L)</span>
      </button>
      <button id="noteBtn" onclick="toggleSpeakerNotes()" title="発表メモ表示 (N)" class="px-2.5 py-1 rounded-full text-[11px] font-medium hover:bg-slate-700 text-slate-300 flex items-center gap-1 transition-colors">
        <span>🎤 メモ (N)</span>
      </button>
      <div class="w-px h-4 bg-slate-700"></div>
      <button onclick="stopPresentation()" title="発表終了 (Esc)" class="p-1.5 hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 rounded-full transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- テキスト選択時ミニフローティング書式バー（印刷時は非表示） -->
  <div id="selectionToolbar" class="no-print absolute hidden z-50 bg-slate-900/95 backdrop-blur-md border border-slate-700 shadow-2xl rounded-lg px-2.5 py-1.5 flex items-center gap-2 text-xs text-white transform -translate-x-1/2 -translate-y-full transition-opacity duration-150 pointer-events-auto">
    <button onclick="formatSelection('bold')" title="太字 (Bold)" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">B</button>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <button onclick="changeSelectionFontSize(-0.15)" title="選択文字 縮小" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">A-</button>
    <button onclick="changeSelectionFontSize(0.15)" title="選択文字 拡大" class="w-6 h-6 flex items-center justify-center font-bold hover:bg-slate-800 rounded text-slate-200">A+</button>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <!-- 選択文字カラー -->
    <div class="flex items-center gap-1">
      <button onclick="formatSelection('color', '#6366f1')" title="Indigo" class="w-3.5 h-3.5 rounded-full bg-[#6366f1] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#2563eb')" title="Blue" class="w-3.5 h-3.5 rounded-full bg-[#2563eb] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#10b981')" title="Green" class="w-3.5 h-3.5 rounded-full bg-[#10b981] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#f59e0b')" title="Amber" class="w-3.5 h-3.5 rounded-full bg-[#f59e0b] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
      <button onclick="formatSelection('color', '#ef4444')" title="Red" class="w-3.5 h-3.5 rounded-full bg-[#ef4444] ring-1 ring-white/20 hover:scale-125 transition-transform"></button>
    </div>
    <div class="w-px h-3.5 bg-slate-700"></div>
    <!-- 蛍光ペンハイライト -->
    <button onclick="formatSelection('highlight', '#fef08a')" title="黄色マーカー" class="px-1.5 py-0.5 rounded text-[11px] font-bold bg-amber-300 text-slate-900 hover:bg-amber-200 transition-colors">蛍光黄</button>
    <button onclick="formatSelection('highlight', '#a7f3d0')" title="緑色マーカー" class="px-1.5 py-0.5 rounded text-[11px] font-bold bg-emerald-300 text-slate-900 hover:bg-emerald-200 transition-colors">蛍光緑</button>
    <!-- リセット -->
    <button onclick="clearSelectionFormat()" title="書式解除" class="w-5 h-5 flex items-center justify-center text-xs hover:bg-slate-800 rounded text-slate-400 hover:text-white ml-0.5">✕</button>
  </div>

  <!-- スライド一覧コンテナ -->
  <main class="slide-viewport flex flex-col items-center gap-10 p-8 pt-10">

    <!-- 
      各スライドの構成例:
      <section class="slide w-[1280px] h-[720px] bg-slate-900 text-white rounded-2xl p-16 shadow-2xl relative flex flex-col justify-between overflow-hidden" contenteditable="true">
        ...スライドコンテンツ...
      </section>

      <!-- スライド 1 メタ情報欄（修正指示 & 発表メモ、印刷時は非表示） -->
      <div class="slide-meta-box no-print w-[1280px] mt-2 mb-8 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3.5 shadow-lg transition-colors focus-within:border-brand-500/80 focus-within:ring-1 focus-within:ring-brand-500/50">
        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-800/80">
          <div class="flex items-center gap-2">
            <button onclick="switchMetaTab(this, 'comment')" class="tab-btn-comment active px-2.5 py-1 rounded text-xs font-semibold bg-brand-600/30 text-brand-300 border border-brand-500/40 flex items-center gap-1.5 transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
              <span>💬 修正指示</span>
            </button>
            <button onclick="switchMetaTab(this, 'note')" class="tab-btn-note px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              <span>🎤 発表メモ</span>
            </button>
          </div>
          <span class="text-[11px] font-mono text-slate-500">Slide 1</span>
        </div>
        
        <!-- 修正指示ペイン -->
        <div class="meta-pane meta-pane-comment flex items-start gap-2.5">
          <div class="slide-comment-input flex-1 min-h-[38px] max-h-[140px] overflow-y-auto px-3 py-2 bg-slate-950/70 border border-slate-700/60 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-brand-500 leading-relaxed" contenteditable="true" data-placeholder="このスライドの修正・要望を入力（例: 箇条書きを3点から2点に集約、KPI数値を30%に変更、配色のトーンを青系に、等）"></div>
          <button onclick="clearMetaField(this, '.slide-comment-input')" title="指示をクリア" class="text-slate-500 hover:text-rose-400 p-1.5 rounded hover:bg-slate-800 text-xs transition-colors shrink-0">✕</button>
        </div>

        <!-- 発表メモペイン（初期非表示） -->
        <div class="meta-pane meta-pane-note hidden flex items-start gap-2.5">
          <div class="slide-note-input flex-1 min-h-[38px] max-h-[140px] overflow-y-auto px-3 py-2 bg-slate-950/70 border border-slate-700/60 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-brand-500 leading-relaxed" contenteditable="true" data-placeholder="発表時のトーク原稿・補足メモを入力（スライドショー投影時に [N] キーで画面下部に表示されます）"></div>
          <button onclick="clearMetaField(this, '.slide-note-input')" title="メモをクリア" class="text-slate-500 hover:text-rose-400 p-1.5 rounded hover:bg-slate-800 text-xs transition-colors shrink-0">✕</button>
        </div>
      </div>
    -->

  </main>

  <script>
    // ----------------------------------------------------
    // 言語設定判定（HTMLの lang 属性に基づく自動ローカライズ）
    // ----------------------------------------------------
    const isJapanese = !document.documentElement.lang || document.documentElement.lang.toLowerCase().startsWith('ja');

    // ----------------------------------------------------
    // 0. ヘッダーモード切替タブ（編集 vs 発表・出力）
    // ----------------------------------------------------
    let currentHeaderTab = 'edit';
    function switchHeaderTab(tabName) {
      currentHeaderTab = tabName;
      const editTabBtn = document.getElementById('tabBtnEdit');
      const presentTabBtn = document.getElementById('tabBtnPresent');
      const editControls = document.getElementById('headerControlsEdit');
      const presentControls = document.getElementById('headerControlsPresent');

      if (tabName === 'edit') {
        if (editTabBtn) {
          editTabBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-brand-600 text-white shadow';
        }
        if (presentTabBtn) {
          presentTabBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200';
        }
        if (editControls) editControls.classList.remove('hidden');
        if (presentControls) presentControls.classList.add('hidden');
      } else {
        if (presentTabBtn) {
          presentTabBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-emerald-600 text-white shadow';
        }
        if (editTabBtn) {
          editTabBtn.className = 'px-3.5 py-1 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200';
        }
        if (presentControls) presentControls.classList.remove('hidden');
        if (editControls) editControls.classList.add('hidden');
      }
      try {
        localStorage.setItem('nativeslide_header_tab_' + getStorageKey(), tabName);
      } catch(e) {}
    }

    // ----------------------------------------------------
    // 1. 編集モードトグル
    // ----------------------------------------------------
    let isEditable = true;
    function toggleEditMode() {
      isEditable = !isEditable;
      const slides = document.querySelectorAll('.slide');
      slides.forEach(slide => {
        slide.setAttribute('contenteditable', isEditable ? 'true' : 'false');
      });
      const statusText = document.getElementById('editStatusText');
      const editIcon = document.getElementById('editIcon');
      if (isEditable) {
        statusText.innerText = isJapanese ? '編集モード: ON' : 'Edit Mode: ON';
        editIcon.classList.add('text-brand-400');
        editIcon.classList.remove('text-slate-400');
      } else {
        statusText.innerText = isJapanese ? '編集モード: OFF (プレビュー)' : 'Edit Mode: OFF (Preview)';
        editIcon.classList.remove('text-brand-400');
        editIcon.classList.add('text-slate-400');
      }
    }

    // ----------------------------------------------------
    // 2. フォントサイズ動的スケーリング (全体 or 選択箇所)
    // ----------------------------------------------------
    let currentFontScale = 1.0;
    function changeFontScale(delta) {
      if (hasTextSelection()) {
        changeSelectionFontSize(delta > 0 ? 0.2 : -0.2);
        return;
      }
      currentFontScale = Math.min(1.25, Math.max(0.85, parseFloat((currentFontScale + delta).toFixed(2))));
      applyFontScale();
    }
    function resetFontScale() {
      if (hasTextSelection()) {
        clearSelectionFormat();
        return;
      }
      currentFontScale = 1.0;
      applyFontScale();
    }
    function applyFontScale() {
      document.getElementById('fontScaleText').innerText = Math.round(currentFontScale * 100) + '%';
      let styleTag = document.getElementById('slide-font-scale-style');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'slide-font-scale-style';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = `
        .slide h1 { font-size: calc(3rem * ${currentFontScale}) !important; line-height: 1.15 !important; }
        .slide h2 { font-size: calc(1.5rem * ${currentFontScale}) !important; line-height: 1.25 !important; }
        .slide h3 { font-size: calc(1rem * ${currentFontScale}) !important; }
        .slide h4 { font-size: calc(0.875rem * ${currentFontScale}) !important; }
        .slide p, .slide ul, .slide ol { font-size: calc(0.875rem * ${currentFontScale}) !important; line-height: 1.6 !important; }
        .slide .text-xs { font-size: calc(0.75rem * ${currentFontScale}) !important; }
        .slide .text-sm { font-size: calc(0.875rem * ${currentFontScale}) !important; }
        .slide .text-base { font-size: calc(1rem * ${currentFontScale}) !important; }
      `;
      if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
    }

    // ----------------------------------------------------
    // 3. テーマカラー適用 (全体 or 選択箇所)
    // ----------------------------------------------------
    // Note: Corporate design template defines fixed brand CI colors in CSS

    function applyCustomColor(hex) {
      if (hasTextSelection()) {
        formatSelection('color', hex);
        return;
      }
      currentCustomBrandHex = hex;
      currentThemeKey = 'custom';
      const root = document.documentElement;
      root.style.setProperty('--brand-500', hex);
      root.style.setProperty('--brand-600', hex);
      root.style.setProperty('--brand-50', hex + '15');
      root.style.setProperty('--brand-100', hex + '25');
      root.style.setProperty('--brand-200', hex + '40');
      if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
    }

    // ----------------------------------------------------
    // 4. テキスト選択の判定 & ミニフローティングバー
    // ----------------------------------------------------
    let savedSelectionRange = null;

    function hasTextSelection() {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) return false;
      const range = selection.getRangeAt(0);
      let container = range.commonAncestorContainer;
      if (container.nodeType === Node.TEXT_NODE) container = container.parentNode;
      return !!container.closest('.slide');
    }

    function updateSelectionToolbar() {
      const toolbar = document.getElementById('selectionToolbar');
      if (!toolbar) return;
      const selection = window.getSelection();
      if (selection.rangeCount > 0 && !selection.isCollapsed) {
        const range = selection.getRangeAt(0);
        let container = range.commonAncestorContainer;
        if (container.nodeType === Node.TEXT_NODE) container = container.parentNode;
        if (container.closest('.slide')) {
          savedSelectionRange = range.cloneRange();
          const rect = range.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            toolbar.style.top = `${rect.top + window.scrollY - 12}px`;
            toolbar.style.left = `${rect.left + window.scrollX + rect.width / 2}px`;
            toolbar.classList.remove('hidden');
            return;
          }
        }
      }
      toolbar.classList.add('hidden');
    }

    document.addEventListener('selectionchange', () => {
      setTimeout(updateSelectionToolbar, 20);
    });

    document.addEventListener('mousedown', (e) => {
      const toolbar = document.getElementById('selectionToolbar');
      if (toolbar && !toolbar.contains(e.target) && !e.target.closest('header')) {
        // スライド内のテキスト以外のクリック時
      }
    });

    // ----------------------------------------------------
    // 5. 選択テキストへのインライン書式適用
    // ----------------------------------------------------
    function getActiveRange() {
      const selection = window.getSelection();
      if (selection.rangeCount > 0 && !selection.isCollapsed) {
        return selection.getRangeAt(0);
      }
      if (savedSelectionRange) {
        selection.removeAllRanges();
        selection.addRange(savedSelectionRange);
        return savedSelectionRange;
      }
      return null;
    }

    function formatSelection(action, value) {
      const range = getActiveRange();
      if (!range) return;

      if (action === 'bold') {
        document.execCommand('bold', false, null);
        updateSelectionToolbar();
        return;
      }

      const span = document.createElement('span');
      if (action === 'color') {
        span.style.color = value;
      } else if (action === 'highlight') {
        span.style.backgroundColor = value;
        span.style.color = '#0f172a';
        span.style.padding = '0.1em 0.35em';
        span.style.borderRadius = '0.25em';
        span.style.fontWeight = '600';
      }

      try {
        const contents = range.extractContents();
        span.appendChild(contents);
        range.insertNode(span);

        const selection = window.getSelection();
        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        selection.removeAllRanges();
        selection.addRange(newRange);
        savedSelectionRange = newRange.cloneRange();
        updateSelectionToolbar();
      } catch (e) {
        console.error('Format selection error:', e);
      }
    }

    function changeSelectionFontSize(delta) {
      const range = getActiveRange();
      if (!range) return;

      let container = range.commonAncestorContainer;
      if (container.nodeType === Node.TEXT_NODE) container = container.parentNode;

      if (container.tagName === 'SPAN' && container.style.fontSize) {
        let currentEm = parseFloat(container.style.fontSize) || 1.0;
        container.style.fontSize = `${Math.max(0.6, Math.min(2.5, currentEm + delta)).toFixed(2)}em`;
      } else {
        const span = document.createElement('span');
        span.style.fontSize = delta > 0 ? '1.25em' : '0.85em';
        try {
          const contents = range.extractContents();
          span.appendChild(contents);
          range.insertNode(span);
          const selection = window.getSelection();
          const newRange = document.createRange();
          newRange.selectNodeContents(span);
          selection.removeAllRanges();
          selection.addRange(newRange);
          savedSelectionRange = newRange.cloneRange();
          updateSelectionToolbar();
        } catch (e) {
          console.error(e);
        }
      }
    }

    function clearSelectionFormat() {
      const range = getActiveRange();
      if (!range) return;
      document.execCommand('removeFormat', false, null);
      updateSelectionToolbar();
    }

    // ----------------------------------------------------
    // 6. 画像ドラッグ＆ドロップ差し替えスクリプト
    // ----------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      const dropzones = document.querySelectorAll('.image-dropzone');
      dropzones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          zone.classList.add('ring-2', 'ring-brand-500');
        });
        zone.addEventListener('dragleave', () => {
          zone.classList.remove('ring-2', 'ring-brand-500');
        });
        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('ring-2', 'ring-brand-500');
          const file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = zone.querySelector('img');
              if (img) {
                img.src = event.target.result;
              }
            };
            reader.readAsDataURL(file);
          }
        });
      });
    });

    // ----------------------------------------------------
    // 7. スライドメタ情報（修正指示 & 発表メモ）処理
    // ----------------------------------------------------
    function switchMetaTab(btn, tabType) {
      const box = btn.closest('.slide-meta-box');
      if (!box) return;
      const commentBtn = box.querySelector('.tab-btn-comment');
      const noteBtn = box.querySelector('.tab-btn-note');
      const commentPane = box.querySelector('.meta-pane-comment');
      const notePane = box.querySelector('.meta-pane-note');

      if (tabType === 'comment') {
        if (commentBtn) commentBtn.className = 'tab-btn-comment active px-2.5 py-1 rounded text-xs font-semibold bg-brand-600/30 text-brand-300 border border-brand-500/40 flex items-center gap-1.5 transition-all';
        if (noteBtn) noteBtn.className = 'tab-btn-note px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all';
        if (commentPane) commentPane.classList.remove('hidden');
        if (notePane) notePane.classList.add('hidden');
      } else {
        if (noteBtn) noteBtn.className = 'tab-btn-note active px-2.5 py-1 rounded text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center gap-1.5 transition-all';
        if (commentBtn) commentBtn.className = 'tab-btn-comment px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all';
        if (commentPane) commentPane.classList.add('hidden');
        if (notePane) notePane.classList.remove('hidden');
      }
    }

    function clearMetaField(btn, selector) {
      const box = btn.closest('.slide-meta-box, .slide-comment-box');
      if (box) {
        const input = box.querySelector(selector);
        if (input) {
          input.innerText = '';
          input.focus();
        }
      }
    }

    function clearSlideComment(btn) {
      clearMetaField(btn, '.slide-comment-input');
    }

    function collectSlideComments() {
      const boxes = document.querySelectorAll('.slide-meta-box, .slide-comment-box');
      const comments = [];
      boxes.forEach((box, index) => {
        const input = box.querySelector('.slide-comment-input');
        const text = input ? input.innerText.trim() : '';
        if (text) {
          comments.push({
            slideNumber: index + 1,
            comment: text
          });
        }
      });
      return comments;
    }

    function copySlideComments() {
      const comments = collectSlideComments();
      const copyBtn = document.getElementById('copyCommentsBtn');
      const originalHtml = copyBtn ? copyBtn.innerHTML : '';

      if (comments.length === 0) {
        alert(isJapanese
          ? '修正指示が入力されていません。\n各スライドの下にある「💬 修正指示」欄に修正要望を入力してください。'
          : 'No revision feedback entered.\nPlease enter change requests in the "💬 Feedback" tab under each slide.'
        );
        return;
      }

      let formatted = isJapanese
        ? '以下のスライド修正指示に基づき、Single-File HTMLコードを改訂してください。指示のないスライドは元の推敲テキストやレイアウトを維持してください。\n\n'
        : 'Please revise the Single-File HTML code based on the following slide revision instructions. Preserve the existing layout and content for slides without changes.\n\n';

      comments.forEach(c => {
        formatted += isJapanese
          ? `【スライド ${c.slideNumber} への修正指示】\n${c.comment}\n\n`
          : `【Slide ${c.slideNumber} Feedback】\n${c.comment}\n\n`;
      });

      navigator.clipboard.writeText(formatted.trim()).then(() => {
        if (copyBtn) {
          copyBtn.innerHTML = `
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span class="text-emerald-300">${isJapanese ? 'コピー完了!' : 'Copied!'}</span>
          `;
          setTimeout(() => {
            copyBtn.innerHTML = originalHtml;
          }, 2500);
        }
      }).catch(err => {
        console.error('Copy failed:', err);
        prompt(isJapanese 
          ? '以下の修正指示をコピーしてAIに貼り付けてください:' 
          : 'Copy the following revision instructions and paste into your AI assistant:', 
          formatted
        );
      });
    }

    function downloadHtmlWithComments() {
      try {
        const titleEl = document.getElementById('deckTitleText');
        const rawTitle = titleEl ? titleEl.innerText.trim() : 'slide';
        const sanitizedTitle = rawTitle.replace(/[\\/:*?"<>|]/g, '_').slice(0, 50) || 'slide';
        const filename = `${sanitizedTitle}_edited.html`;

        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        a.setAttribute('download', filename);
        document.body.appendChild(a);
        a.click();

        // revokeObjectURL の即時実行によるブラウザのファイル名・拡張子破綻を防止するため遅延解放
        setTimeout(() => {
          if (a.parentNode) document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1500);
      } catch (e) {
        console.error('HTML download failed:', e);
      }
    }

    // ----------------------------------------------------
    // 8. 目次（TOC）ドロワーナビゲーション
    // ----------------------------------------------------
    let isTocOpen = false;

    function initToc() {
      const list = document.getElementById('tocList');
      if (!list) return;
      const slides = document.querySelectorAll('.slide');
      list.innerHTML = '';

      slides.forEach((slide, idx) => {
        const heading = slide.querySelector('h1, h2');
        const fallbackTitle = isJapanese ? `スライド ${idx + 1}` : `Slide ${idx + 1}`;
        const title = heading ? heading.innerText.trim().replace(/\s+/g, ' ') : fallbackTitle;
        const item = document.createElement('div');
        const isActive = isPresentationMode ? (currentPresentationIndex === idx) : false;
        
        item.className = `toc-item group flex items-start gap-2.5 p-2.5 rounded-lg border transition-all cursor-pointer ${
          isActive 
            ? 'bg-brand-900/40 border-brand-500/70 text-white' 
            : 'border-slate-800 bg-slate-800/40 hover:bg-slate-800 hover:border-brand-500/50 text-slate-300 hover:text-white'
        }`;
        
        item.onclick = () => {
          if (isPresentationMode) {
            currentPresentationIndex = idx;
            renderPresentationSlide();
          } else {
            slide.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          toggleTocDrawer(false);
        };

        item.innerHTML = `
          <span class="shrink-0 w-6 h-6 rounded bg-slate-700/70 group-hover:bg-brand-600 font-mono text-xs font-bold flex items-center justify-center text-slate-300 group-hover:text-white transition-colors">${idx + 1}</span>
          <span class="text-xs font-medium line-clamp-2 leading-tight pt-0.5">${title}</span>
        `;
        list.appendChild(item);
      });
    }

    function toggleTocDrawer(forceState) {
      const drawer = document.getElementById('tocDrawer');
      const backdrop = document.getElementById('tocBackdrop');
      if (!drawer || !backdrop) return;

      isTocOpen = (typeof forceState === 'boolean') ? forceState : !isTocOpen;

      if (isTocOpen) {
        initToc();
        drawer.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // ----------------------------------------------------
    // 9. 全画面プレゼンテーション（スライドショーモード）
    // ----------------------------------------------------
    let isPresentationMode = false;
    let currentPresentationIndex = 0;

    function getMostVisibleSlideIndex() {
      const slides = document.querySelectorAll('.slide');
      if (!slides.length) return 0;
      let minDiff = Infinity;
      let bestIdx = 0;
      const centerY = window.innerHeight / 2;

      slides.forEach((slide, idx) => {
        const rect = slide.getBoundingClientRect();
        const slideCenterY = rect.top + rect.height / 2;
        const diff = Math.abs(slideCenterY - centerY);
        if (diff < minDiff) {
          minDiff = diff;
          bestIdx = idx;
        }
      });
      return bestIdx;
    }

    function startPresentation(startIndex) {
      if (typeof switchHeaderTab === 'function') switchHeaderTab('present');
      const slides = document.querySelectorAll('.slide');
      if (!slides.length) return;

      currentPresentationIndex = (typeof startIndex === 'number') 
        ? Math.max(0, Math.min(slides.length - 1, startIndex)) 
        : getMostVisibleSlideIndex();

      const modal = document.getElementById('presentationModal');
      if (!modal) return;

      modal.classList.remove('hidden');
      isPresentationMode = true;

      // ブラウザフルスクリーンのリクエスト（任意）
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      renderPresentationSlide();
    }

    function stopPresentation() {
      const modal = document.getElementById('presentationModal');
      if (modal) modal.classList.add('hidden');
      isPresentationMode = false;

      // レーザーポインター解除
      if (isLaserActive) toggleLaser();

      // 発表メモ非表示
      const overlay = document.getElementById('speakerNotesOverlay');
      if (overlay) overlay.classList.add('hidden');

      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function fitPresentationSlide() {
      const stage = document.getElementById('presentationStage');
      if (!stage) return;
      const slide = stage.querySelector('.slide');
      if (!slide) return;

      const is43 = slide.classList.contains('w-[1024px]');
      const slideW = is43 ? 1024 : 1280;
      const slideH = is43 ? 768 : 720;
      
      const availW = window.innerWidth;
      const availH = window.innerHeight;
      const scale = Math.min((availW - 32) / slideW, (availH - 32) / slideH);

      stage.style.transform = `scale(${Math.max(0.15, scale)})`;
      stage.style.transformOrigin = 'center center';
    }

    function renderPresentationSlide() {
      const slides = document.querySelectorAll('.slide');
      if (!slides.length) return;
      if (currentPresentationIndex < 0) currentPresentationIndex = 0;
      if (currentPresentationIndex >= slides.length) currentPresentationIndex = slides.length - 1;

      const stage = document.getElementById('presentationStage');
      if (!stage) return;
      stage.innerHTML = '';

      const originalSlide = slides[currentPresentationIndex];
      const clone = originalSlide.cloneNode(true);
      clone.setAttribute('contenteditable', 'false');
      clone.style.margin = '0';
      clone.style.boxShadow = '0 25px 60px -15px rgba(0, 0, 0, 0.8)';
      stage.appendChild(clone);

      const counter = document.getElementById('presentationCounter');
      if (counter) {
        counter.innerText = `${currentPresentationIndex + 1} / ${slides.length}`;
      }

      updateSpeakerNotesContent();
      fitPresentationSlide();
      if (typeof broadcastSyncState === 'function') broadcastSyncState();
    }

    function nextSlide() {
      const slides = document.querySelectorAll('.slide');
      if (currentPresentationIndex < slides.length - 1) {
        currentPresentationIndex++;
        renderPresentationSlide();
      }
    }

    function prevSlide() {
      if (currentPresentationIndex > 0) {
        currentPresentationIndex--;
        renderPresentationSlide();
      }
    }

    function handleStageClick(event) {
      if (!isPresentationMode) return;
      if (event.target.closest('#speakerNotesOverlay') || event.target.closest('button')) return;

      const x = event.clientX;
      if (x < window.innerWidth * 0.25) {
        prevSlide();
      } else {
        nextSlide();
      }
    }

    // ----------------------------------------------------
    // 10. スピーカーノート（発表メモ）
    // ----------------------------------------------------
    function updateSpeakerNotesContent() {
      const titleEl = document.getElementById('speakerNotesTitle');
      const textEl = document.getElementById('speakerNotesText');
      if (!textEl) return;

      const metaBoxes = document.querySelectorAll('.slide-meta-box');
      const currentBox = metaBoxes[currentPresentationIndex];
      let noteText = '';
      if (currentBox) {
        const noteInput = currentBox.querySelector('.slide-note-input');
        if (noteInput) {
          noteText = noteInput.innerText.trim();
        }
      }

      if (titleEl) {
        titleEl.innerText = isJapanese 
          ? `🎤 発表メモ (Slide ${currentPresentationIndex + 1})`
          : `🎤 Speaker Notes (Slide ${currentPresentationIndex + 1})`;
      }
      if (noteText) {
        textEl.innerText = noteText;
      } else {
        textEl.innerHTML = isJapanese
          ? '<span class="text-slate-500 italic">（このスライドに発表メモは入力されていません）</span>'
          : '<span class="text-slate-500 italic">(No speaker notes entered for this slide)</span>';
      }
    }

    function toggleSpeakerNotes() {
      const overlay = document.getElementById('speakerNotesOverlay');
      const noteBtn = document.getElementById('noteBtn');
      if (!overlay) return;

      const isHidden = overlay.classList.contains('hidden');
      if (isHidden) {
        updateSpeakerNotesContent();
        overlay.classList.remove('hidden');
        if (noteBtn) noteBtn.classList.add('bg-amber-500/30', 'text-amber-300');
      } else {
        overlay.classList.add('hidden');
        if (noteBtn) noteBtn.classList.remove('bg-amber-500/30', 'text-amber-300');
      }
    }

    // ----------------------------------------------------
    // 11. レーザーポインター
    // ----------------------------------------------------
    let isLaserActive = false;

    function toggleLaser() {
      isLaserActive = !isLaserActive;
      const laser = document.getElementById('laserPointer');
      const laserBtn = document.getElementById('laserBtn');
      const modal = document.getElementById('presentationModal');
      if (!laser || !modal) return;

      if (isLaserActive) {
        laser.classList.remove('hidden');
        modal.style.cursor = 'none';
        if (laserBtn) laserBtn.classList.add('bg-rose-600/40', 'text-rose-300');
      } else {
        laser.classList.add('hidden');
        modal.style.cursor = 'default';
        if (laserBtn) laserBtn.classList.remove('bg-rose-600/40', 'text-rose-300');
      }
    }

    document.addEventListener('mousemove', (e) => {
      if (isPresentationMode && isLaserActive) {
        const laser = document.getElementById('laserPointer');
        if (laser) {
          laser.style.left = `${e.clientX}px`;
          laser.style.top = `${e.clientY}px`;
        }
      }
    });

    // ----------------------------------------------------
    // 12. キーボードショートカット & リサイズリスナー
    // ----------------------------------------------------
    document.addEventListener('keydown', (e) => {
      const isEditing = ['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable;

      if (e.key === 'Escape') {
        if (isPresentationMode) {
          stopPresentation();
          e.preventDefault();
        } else if (isTocOpen) {
          toggleTocDrawer(false);
          e.preventDefault();
        }
        return;
      }

      if (isEditing) return;

      if (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S') {
        if (!isTocOpen) {
          e.preventDefault();
          openSpeakerView();
          return;
        }
      }

      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        if (!isPresentationMode) {
          startPresentation();
        } else {
          stopPresentation();
        }
      } else if (isPresentationMode) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          toggleSpeakerNotes();
        } else if (e.key === 'l' || e.key === 'L') {
          e.preventDefault();
          toggleLaser();
        }
      }
    });

    window.addEventListener('resize', () => {
      if (isPresentationMode) {
        fitPresentationSlide();
      }
    });

    // ----------------------------------------------------
    // 12. 多言語UI自動切替（lang属性に基づく自動ローカライズ）

    // ----------------------------------------------------
    // 13. LocalStorage 自動保存 & 復元
    // ----------------------------------------------------
    const STORAGE_PREFIX = 'nativeslide_autosave_';
    function getStorageKey() {
      const path = window.location.pathname || 'deck';
      return STORAGE_PREFIX + path.replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    let saveDebounceTimer = null;
    function scheduleAutoSave() {
      const dot = document.getElementById('saveStatusDot');
      const text = document.getElementById('saveStatusText');
      if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
      if (text) text.innerText = isJapanese ? '保存中...' : 'Saving...';

      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => {
        performAutoSave();
      }, 400);
    }

    function performAutoSave() {
      try {
        const slides = document.querySelectorAll('.slide');
        const slideData = [];
        slides.forEach(s => slideData.push(s.innerHTML));

        const metaBoxes = document.querySelectorAll('.slide-meta-box, .slide-comment-box');
        const comments = [];
        const notes = [];
        metaBoxes.forEach(box => {
          const c = box.querySelector('.slide-comment-input');
          const n = box.querySelector('.slide-note-input');
          comments.push(c ? c.innerText : '');
          notes.push(n ? n.innerText : '');
        });

        const saveData = {
          slides: slideData,
          comments: comments,
          notes: notes,
          fontScale: currentFontScale,
          
          customHex: currentCustomBrandHex,
          updatedAt: Date.now()
        };
        localStorage.setItem(getStorageKey(), JSON.stringify(saveData));

        const dot = document.getElementById('saveStatusDot');
        const text = document.getElementById('saveStatusText');
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
        if (text) text.innerText = isJapanese ? '自動保存: 済' : 'Auto-Saved';
      } catch (e) {
        console.warn('AutoSave failed:', e);
      }
    }

    function restoreFromStorage() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data) return;

        if (Array.isArray(data.slides)) {
          const slides = document.querySelectorAll('.slide');
          data.slides.forEach((html, idx) => {
            if (slides[idx] && html) {
              slides[idx].innerHTML = html;
            }
          });
        }

        const metaBoxes = document.querySelectorAll('.slide-meta-box, .slide-comment-box');
        metaBoxes.forEach((box, idx) => {
          const c = box.querySelector('.slide-comment-input');
          const n = box.querySelector('.slide-note-input');
          if (c && data.comments && typeof data.comments[idx] === 'string') c.innerText = data.comments[idx];
          if (n && data.notes && typeof data.notes[idx] === 'string') n.innerText = data.notes[idx];
        });

        if (data.fontScale && typeof data.fontScale === 'number') {
          currentFontScale = data.fontScale;
          applyFontScale();
        }

        if (data.themeKey && themePresets[data.themeKey]) {
          applyColorPreset(data.themeKey);
        } else if (data.customHex) {
          applyCustomColor(data.customHex);
        }

        const text = document.getElementById('saveStatusText');
        if (text) text.innerText = isJapanese ? '編集を自動復元済' : 'Edits restored';
      } catch (e) {
        console.warn('Restore failed:', e);
      }
    }

    function resetSavedChanges() {
      const msg = isJapanese 
        ? '保存された推敲テキストやメモをすべて破棄し、初期HTMLの状態に戻しますか？'
        : 'Discard all saved edits and reset to original HTML?';
      if (confirm(msg)) {
        localStorage.removeItem(getStorageKey());
        location.reload();
      }
    }

    function setupAutoSaveListeners() {
      document.addEventListener('input', (e) => {
        if (e.target.closest('.slide') || e.target.closest('.slide-meta-box') || e.target.closest('.slide-comment-box')) {
          scheduleAutoSave();
        }
      });
    }

    // ----------------------------------------------------
    // 14. 発表者ツール (Speaker View) & BroadcastChannel
    // ----------------------------------------------------
    let presenterBus = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        presenterBus = new BroadcastChannel('nativeslide_bus_' + getStorageKey());
        presenterBus.onmessage = (e) => {
          const msg = e.data;
          if (!msg) return;
          if (msg.type === 'GOTO') {
            currentPresentationIndex = msg.index;
            if (isPresentationMode) {
              renderPresentationSlide();
            } else {
              const slides = document.querySelectorAll('.slide');
              if (slides[msg.index]) {
                slides[msg.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }
            broadcastSyncState();
          } else if (msg.type === 'SYNC_REQUEST') {
            broadcastSyncState();
          } else if (msg.type === 'UPDATE_NOTE') {
            const metaBoxes = document.querySelectorAll('.slide-meta-box, .slide-comment-box');
            if (metaBoxes[msg.index]) {
              const noteEl = metaBoxes[msg.index].querySelector('.slide-note-input');
              if (noteEl) {
                noteEl.innerText = msg.text;
                scheduleAutoSave();
              }
            }
          }
        };
      }
    } catch(e) {
      console.warn('BroadcastChannel error:', e);
    }

    function broadcastSyncState() {
      if (!presenterBus) return;
      const slides = document.querySelectorAll('.slide');
      const metaBoxes = document.querySelectorAll('.slide-meta-box, .slide-comment-box');
      const slideSummaries = [];
      const notes = [];

      // CSS変数（テーマカラー、アクセントカラー）の取得
      const rootStyle = getComputedStyle(document.documentElement);
      const brandVars = [
        '--brand-50', '--brand-100', '--brand-200', '--brand-500',
        '--brand-600', '--brand-700', '--brand-900', '--brand-950',
        '--accent-400', '--accent-500', '--accent-600'
      ];
      const cssVars = {};
      brandVars.forEach(v => {
        const val = rootStyle.getPropertyValue(v).trim();
        if (val) cssVars[v] = val;
      });

      slides.forEach((s, idx) => {
        const h = s.querySelector('h1, h2');
        slideSummaries.push({
          index: idx,
          title: h ? h.innerText.trim() : (isJapanese ? `スライド ${idx+1}` : `Slide ${idx+1}`),
          html: s.innerHTML,
          className: s.className,
          style: s.getAttribute('style') || ''
        });
        const n = metaBoxes[idx] ? metaBoxes[idx].querySelector('.slide-note-input') : null;
        notes.push(n ? n.innerText : '');
      });

      const firstSlide = slides[0];
      const baseWidth = firstSlide ? (firstSlide.offsetWidth || 1280) : 1280;
      const baseHeight = firstSlide ? (firstSlide.offsetHeight || 720) : 720;

      presenterBus.postMessage({
        type: 'STATE_UPDATE',
        currentIndex: currentPresentationIndex,
        total: slides.length,
        deckTitle: document.title || 'NativeSlide',
        slides: slideSummaries,
        notes: notes,
        baseWidth: baseWidth,
        baseHeight: baseHeight,
        cssVars: cssVars
      });
    }

        <button id="timerToggleBtn" onclick="toggleTimer()" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] font-semibold text-slate-300 transition-colors">${langJa ? '一時停止' : 'Pause'}</button>
        <button onclick="resetTimer()" title="タイマーを0にリセット" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <select onchange="setDuration(this.value)" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-[11px] text-slate-300">
          <option value="5">5分</option>
          <option value="10">10分</option>
          <option value="15" selected>15分</option>
          <option value="20">20分</option>
          <option value="30">30分</option>
          <option value="45">45分</option>
          <option value="60">60分</option>
        </select>
      </div>
    </div>

    <div class="flex items-center gap-3 text-xs">
      <span id="wallClock" class="mono text-slate-400 font-semibold">12:00:00</span>
      <button onclick="window.close()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-300 transition-colors text-[11px]">${langJa ? '閉じる' : 'Close'}</button>
    </div>
  </header>

  <div class="flex-1 flex min-h-0">
    <div class="w-[58%] border-r border-slate-800 p-4 flex flex-col justify-between overflow-hidden bg-slate-950/40">
      <div class="flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between pb-1.5 mb-1.5 text-[11px] font-bold text-slate-400">
          <span class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            ${langJa ? '現在投影中のスライド' : 'CURRENT SLIDE'}
          </span>
          <span id="currentSlideTitle" class="text-slate-500 font-normal truncate max-w-[300px]"></span>
        </div>
        <div id="currentStageWrapper" class="flex-1 relative bg-black/40 rounded-lg border border-slate-800 overflow-hidden flex items-center justify-center p-2">
          <div id="currentStageBox" class="relative shrink-0 overflow-hidden shadow-2xl rounded" style="width: 0px; height: 0px;">
            <div id="currentStageScaler" class="shrink-0" style="width: 1280px; height: 720px; min-width: 1280px; min-height: 720px; flex-shrink: 0; position: absolute; top: 0; left: 0; transform-origin: 0 0;">
              <div id="currentSlideContent" class="slide-preview-frame"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-3 pt-3 border-t border-slate-800 flex items-center justify-between gap-4 h-36">
        <div class="flex items-center gap-2">
          <button onclick="navPrev()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-bold rounded-xl border border-slate-700 flex items-center gap-1.5 text-sm transition-all shadow-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            <span>${langJa ? '前へ (←)' : 'Prev (←)'}</span>
          </button>
          <button onclick="navNext()" class="px-5 py-3 bg-brand-600 hover:bg-brand-500 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30 flex items-center gap-1.5 text-sm transition-all">
            <span>${langJa ? '次へ (→)' : 'Next (→)'}</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>

        <div class="flex-1 flex flex-col h-full pl-4 border-l border-slate-800/80 min-w-0">
          <div class="text-[10px] uppercase font-bold text-slate-500 mb-1 flex items-center justify-between gap-2 overflow-hidden min-w-0">
            <span class="whitespace-nowrap shrink-0 text-slate-400 font-bold">${langJa ? '次のスライド' : 'NEXT SLIDE'}</span>
            <span id="nextSlideTitle" class="text-slate-400 font-normal truncate min-w-0 flex-1 text-right"></span>
          </div>
          <div id="nextStageWrapper" class="flex-1 relative bg-black/40 rounded border border-slate-800/80 overflow-hidden flex items-center justify-center p-1.5 min-h-0 min-w-0">
            <div id="nextStageBox" class="relative shrink-0 overflow-hidden shadow-lg rounded" style="width: 0px; height: 0px;">
              <div id="nextStageScaler" class="shrink-0" style="width: 1280px; height: 720px; min-width: 1280px; min-height: 720px; flex-shrink: 0; position: absolute; top: 0; left: 0; transform-origin: 0 0;">
                <div id="nextSlideContent" class="slide-preview-frame"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="w-[42%] flex flex-col bg-slate-900/30 p-5 min-h-0">
      <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="text-amber-400 text-sm">🎤</span>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">${langJa ? '発表者ノート・原稿' : 'SPEAKER NOTES'}</h2>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="changeNoteFontSize(-2)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-slate-300">A-</button>
          <button onclick="changeNoteFontSize(2)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-slate-300">A+</button>
        </div>
      </div>
      
      <div id="speakerNoteArea" oninput="handleNoteEdit()" class="flex-1 overflow-y-auto p-4 bg-slate-950/70 border border-slate-800 rounded-xl text-slate-200 leading-relaxed whitespace-pre-wrap focus:outline-none focus:border-brand-500/80 text-base font-sans" contenteditable="true"></div>
      
      <div class="mt-2 text-[11px] text-slate-500 flex items-center justify-between">
        <span>${langJa ? '※編集内容は自動保存・メイン同期されます' : '※ Edits auto-sync & save'}</span>
        <span class="mono text-[10px] text-slate-600">Shortcuts: [←/→/Space]</span>
      </div>
    </div>
  </div>

  <script>
    const bus = new BroadcastChannel('${channelKey}');
    let currentIdx = 0;
    let deckData = { slides: [], notes: [], total: 0 };
    let noteFontSize = 18;

    bus.onmessage = (e) => {
      const msg = e.data;
      if (!msg) return;
      if (msg.type === 'STATE_UPDATE') {
        currentIdx = msg.currentIndex;
        deckData = msg;
        if (msg.cssVars) {
          Object.keys(msg.cssVars).forEach(k => {
            document.documentElement.style.setProperty(k, msg.cssVars[k]);
          });
        }
        renderAll();
      }
    };

    function navNext() {
      if (currentIdx < deckData.total - 1) {
        currentIdx++;
        notifyMainGoto();
        renderAll();
      }
    }
    function navPrev() {
      if (currentIdx > 0) {
        currentIdx--;
        notifyMainGoto();
        renderAll();
      }
    }
    function notifyMainGoto() {
      bus.postMessage({ type: 'GOTO', index: currentIdx });
    }

    function renderAll() {
      document.getElementById('slideCounter').innerText = 'Slide ' + (currentIdx + 1) + ' / ' + deckData.total;
      document.getElementById('deckTitle').innerText = deckData.deckTitle || 'NativeSlide';

      const baseW = deckData.baseWidth || 1280;
      const baseH = deckData.baseHeight || 720;

      const cur = deckData.slides[currentIdx];
      const curContent = document.getElementById('currentSlideContent');
      const curTitle = document.getElementById('currentSlideTitle');
      if (cur) {
        curContent.className = (cur.className || 'slide') + ' slide-preview-frame';
        curContent.style.cssText = (cur.style || '') + '; width: ' + baseW + 'px !important; height: ' + baseH + 'px !important; min-width: ' + baseW + 'px !important; min-height: ' + baseH + 'px !important; max-width: ' + baseW + 'px !important; max-height: ' + baseH + 'px !important; overflow: hidden !important; position: absolute; top: 0; left: 0; margin: 0 !important; pointer-events: none; user-select: none; box-shadow: none;';
        curContent.innerHTML = cur.html;
        curTitle.innerText = cur.title || '';
      }
      fitPreview('currentStageWrapper', 'currentStageBox', 'currentStageScaler', baseW, baseH);

      const nextIdx = currentIdx + 1;
      const next = deckData.slides[nextIdx];
      const nextContent = document.getElementById('nextSlideContent');
      const nextTitle = document.getElementById('nextSlideTitle');
      const nextBox = document.getElementById('nextStageBox');
      if (next) {
        nextContent.className = (next.className || 'slide') + ' slide-preview-frame';
        nextContent.style.cssText = (next.style || '') + '; width: ' + baseW + 'px !important; height: ' + baseH + 'px !important; min-width: ' + baseW + 'px !important; min-height: ' + baseH + 'px !important; max-width: ' + baseW + 'px !important; max-height: ' + baseH + 'px !important; overflow: hidden !important; position: absolute; top: 0; left: 0; margin: 0 !important; pointer-events: none; user-select: none; box-shadow: none;';
        nextContent.innerHTML = next.html;
        nextTitle.innerText = next.title || '';
        if (nextBox) nextBox.style.opacity = '1';
      } else {
        nextContent.className = 'slide-preview-frame';
        nextContent.style.cssText = 'width: ' + baseW + 'px !important; height: ' + baseH + 'px !important; min-width: ' + baseW + 'px !important; min-height: ' + baseH + 'px !important; max-width: ' + baseW + 'px !important; max-height: ' + baseH + 'px !important; overflow: hidden !important; position: absolute; top: 0; left: 0; margin: 0 !important;';
        nextContent.innerHTML = '<div class="w-full h-full flex flex-col items-center justify-center bg-slate-900/95 text-slate-300 font-bold text-5xl gap-6 border-2 border-dashed border-slate-700/80 rounded-2xl"><span>🏁</span><span class="tracking-wide">${langJa ? '発表終了 (最後のスライド)' : 'End of presentation'}</span></div>';
        nextTitle.innerText = '${langJa ? '終了' : 'End'}';
        if (nextBox) nextBox.style.opacity = '0.9';
      }
      fitPreview('nextStageWrapper', 'nextStageBox', 'nextStageScaler', baseW, baseH);

      const noteArea = document.getElementById('speakerNoteArea');
      const note = deckData.notes[currentIdx] || '';
      noteArea.innerText = note;
    }

    function fitPreview(wrapperId, boxId, scalerId, baseW, baseH) {
      const wrap = document.getElementById(wrapperId);
      const box = document.getElementById(boxId);
      const scaler = document.getElementById(scalerId);
      if (!wrap || !box || !scaler) return;
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (w <= 0 || h <= 0) return;
      const pad = 12;
      const availW = Math.max(10, w - pad);
      const availH = Math.max(10, h - pad);
      const scale = Math.min(availW / baseW, availH / baseH);
      const safeScale = Math.max(0.05, scale);

      const scaledW = Math.floor(baseW * safeScale);
      const scaledH = Math.floor(baseH * safeScale);

      box.style.width = scaledW + 'px';
      box.style.height = scaledH + 'px';

      scaler.style.width = baseW + 'px';
      scaler.style.height = baseH + 'px';
      scaler.style.minWidth = baseW + 'px';
      scaler.style.minHeight = baseH + 'px';
      scaler.style.maxWidth = baseW + 'px';
      scaler.style.maxHeight = baseH + 'px';
      scaler.style.transform = 'scale(' + safeScale + ')';
      scaler.style.transformOrigin = '0 0';
    }

    function handleNoteEdit() {
      const noteArea = document.getElementById('speakerNoteArea');
      const text = noteArea.innerText;
      deckData.notes[currentIdx] = text;
      bus.postMessage({ type: 'UPDATE_NOTE', index: currentIdx, text: text });
    }

    function changeNoteFontSize(delta) {
      noteFontSize = Math.max(12, Math.min(32, noteFontSize + delta));
      document.getElementById('speakerNoteArea').style.fontSize = noteFontSize + 'px';
    }

    window.addEventListener('keydown', (e) => {
      const isEditing = e.target.isContentEditable || ['INPUT', 'TEXTAREA'].includes(e.target.tagName);
      if (isEditing) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'ArrowDown') {
        e.preventDefault();
        navNext();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') {
        e.preventDefault();
        navPrev();
      }
    });

    window.addEventListener('resize', () => {
      const baseW = deckData.baseWidth || 1280;
      const baseH = deckData.baseHeight || 720;
      fitPreview('currentStageWrapper', 'currentStageBox', 'currentStageScaler', baseW, baseH);
      fitPreview('nextStageWrapper', 'nextStageBox', 'nextStageScaler', baseW, baseH);
    });

    let elapsedSec = 0;
    let targetSec = 15 * 60;
    let isTimerRunning = true;
    let timerInterval = setInterval(() => {
      if (isTimerRunning) {
        elapsedSec++;
        updateTimerDisplay();
      }
      const now = new Date();
      document.getElementById('wallClock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    function setDuration(min) {
      targetSec = parseInt(min, 10) * 60;
      updateTimerDisplay();
    }
    function toggleTimer() {
      isTimerRunning = !isTimerRunning;
      document.getElementById('timerToggleBtn').innerText = isTimerRunning ? '${langJa ? '一時停止' : 'Pause'}' : '${langJa ? '再開' : 'Resume'}';
    }
    function resetTimer() {
      elapsedSec = 0;
      updateTimerDisplay();
    }
    function updateTimerDisplay() {
      const elMin = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const elSec = String(elapsedSec % 60).padStart(2, '0');
      document.getElementById('elapsedTime').innerText = elMin + ':' + elSec;

      const remain = targetSec - elapsedSec;
      const remEl = document.getElementById('remainTime');
      if (remain >= 0) {
        const rMin = String(Math.floor(remain / 60)).padStart(2, '0');
        const rSec = String(remain % 60).padStart(2, '0');
        remEl.innerText = rMin + ':' + rSec;
        if (remain <= 120) {
          remEl.className = 'mono text-sm font-bold text-amber-400 animate-pulse';
        } else {
          remEl.className = 'mono text-sm font-bold text-emerald-400';
        }
      } else {
        const over = Math.abs(remain);
        const oMin = String(Math.floor(over / 60)).padStart(2, '0');
        const oSec = String(over % 60).padStart(2, '0');
        remEl.innerText = '-' + oMin + ':' + oSec;
        remEl.className = 'mono text-sm font-bold text-rose-500 animate-pulse';
      }
    }

    bus.postMessage({ type: 'SYNC_REQUEST' });
  <\/script>
</body>
</html>`;

      speakerWindowRef.document.open();
      speakerWindowRef.document.write(speakerHtml);
      speakerWindowRef.document.close();

      setTimeout(() => {
        broadcastSyncState();
      }, 200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      restoreFromStorage();
      applyAutoLocalization();
      setupAutoSaveListeners();

      try {
        const savedTab = localStorage.getItem('nativeslide_header_tab_' + getStorageKey());
        if (savedTab) {
          switchHeaderTab(savedTab);
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
